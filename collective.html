<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>集體潛意識 v1 · deskwalk</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="proto-mono.css" />
    <style>
      :root {
        --card-edge: #F1ECE0;
        --ink-on-card: #1F1B14;
        --ink-on-card-faint: #A8A091;
        --ink-faint: #A49B8C;
        --serif: var(--sans);
      }
      html, body { height: 100%; }
      body {
        color: var(--ink);
        font-size: 16px;
        letter-spacing: 0.01em;
        overflow-x: hidden;
        min-height: 100vh;
      }

      .stage {
        max-width: 560px;
        margin: 0 auto;
        padding: 3.25rem 1.75rem 7rem;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── 題型篩選 ───────────────────────────── */
      .pills {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
        margin-bottom: 2.5rem;
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: var(--pill);
        background: var(--card-strong);
        color: var(--ink-soft);
        font: inherit;
        font-size: 0.82rem;
        padding: 0.34rem 0.9rem;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      }
      .pill:hover { color: var(--ink); }
      .pill[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .pill .n { opacity: 0.5; margin-left: 0.3rem; font-size: 0.76rem; }

      /* ── 卡組 ──────────────────────────────── */
      .question-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1.25rem;
        padding-bottom: 1.5rem;
      }
      .eyebrow {
        font-size: 0.74rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0;
      }
      .deck {
        /* 卡片跟著視窗高度縮，整頁不用捲動 */
        --deck-max-h: min(50vh, 26rem);
        position: relative;
        width: min(22rem, 86vw, calc(var(--deck-max-h) * 5 / 7));
        height: auto;
        max-height: var(--deck-max-h);
        aspect-ratio: 5 / 7;
        margin: 0 auto;
      }
      .card {
        position: absolute;
        inset: 0;
        background: var(--card);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.45s ease;
      }
      /* 牌堆位置：0 = 面頂，1、2 疊喺下面等上場 */
      .card[data-pos="0"] {
        --dx: 0px;
        --dy: 0px;
        --tilt: 0deg;
        z-index: 3;
        transform:
          translate3d(var(--dx), var(--dy), 0)
          rotate(calc(-2deg + var(--tilt)));
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .card[data-pos="1"] {
        transform: translate(5px, 4px) rotate(-1deg) scale(0.985);
        opacity: 0.94;
        z-index: 2;
      }
      .card[data-pos="2"] {
        transform: translate(10px, 8px) rotate(2.4deg) scale(0.97);
        background: var(--card-edge);
        opacity: 0.8;
        z-index: 1;
      }
      /* 抽走那張：沿掃出方向飛離牌堆，transform 由 JS 設定 */
      .card.gone {
        opacity: 0;
        z-index: 4;
        background: var(--card);
        /* 遲少少先淡出，卡片要見到真係飛離牌堆 */
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.26s ease 0.22s;
      }
      /* 拖拉時卡片要即時跟手，不能有過場 */
      .card.dragging { transition: none; cursor: grabbing; }
      .card.no-anim { transition: none; }
      .card[data-pos="0"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      .face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 1.4rem 1.6rem 1.8rem;
      }
      .card-symbol {
        flex: 1;
        display: grid;
        place-items: center;
        color: var(--ink-on-card);
        min-height: 0;
      }
      .card-symbol svg {
        width: 70%;
        max-width: 12rem;
        height: auto;
        max-height: 100%;
      }
      .card-divider {
        width: 1.5rem;
        height: 1px;
        background: var(--ink-on-card-faint);
        margin: 0.4rem auto 0.8rem;
        opacity: 0.55;
      }
      .question {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(1.35rem, 5vw, 1.7rem);
        line-height: 1.5;
        color: var(--ink-on-card);
        margin: 0 auto;
        max-width: 14ch;
      }
      /* 填空題的空格 — 柔和的凹槽，不用粗線 */
      .question .blank {
        display: inline-block;
        width: 1.9em;
        height: 1.1em;
        margin: 0 0.14em;
        vertical-align: -0.16em;
        border-radius: 8px;
        background: rgba(31, 27, 20, 0.07);
      }
      .face.blank-face .question {
        letter-spacing: 0.04em;
        font-size: clamp(1.6rem, 6vw, 2rem);
      }
      .question.placeholder { color: var(--ink-on-card-faint); }

      .hint {
        font-family: var(--serif);
        font-size: 0.85rem;
        color: var(--ink-soft);
        margin: 0;
        letter-spacing: 0.04em;
      }

      /* ── 動作 ──────────────────────────────── */
      .actions {
        display: flex;
        justify-content: center;
      }
      .btn {
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        padding: 0.9rem 1.9rem;
        border-radius: var(--radius-sm);
        cursor: pointer;
        background: linear-gradient(180deg, #4A443B, var(--accent));
        color: #fff;
        border: none;
        box-shadow: var(--shadow-pop);
        transition: transform 0.06s, box-shadow 0.06s;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: var(--shadow-press);
      }

      /* ── 頁腳 ──────────────────────────────── */
      .footer-info {
        position: fixed;
        bottom: 1.25rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-faint);
        pointer-events: none;
      }
      .reset {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
        pointer-events: auto;
        padding: 0;
      }
      .reset:hover { color: var(--ink-soft); }

      /* ── 手機：卡片 + 按鈕一屏內 ────────────── */
      @media (max-width: 540px) {
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { min-height: 100dvh; }

        .stage {
          max-width: none;
          width: 100%;
          height: 100dvh;
          max-height: 100dvh;
          min-height: 0;
          padding:
            max(3rem, calc(env(safe-area-inset-top) + 2.6rem))
            max(1rem, env(safe-area-inset-right))
            calc(2.75rem + env(safe-area-inset-bottom))
            max(1rem, env(safe-area-inset-left));
          display: grid;
          grid-template-rows: auto minmax(0, 1fr) auto;
          gap: 0.5rem;
          overflow: hidden;
        }

        .pills { margin-bottom: 0; }
        .pill { font-size: 0.78rem; padding: 0.3rem 0.75rem; }

        .question-block {
          flex: none;
          min-height: 0;
          gap: 0.6rem;
          padding-bottom: 0;
          overflow: hidden;
        }

        .eyebrow { font-size: 0.65rem; letter-spacing: 0.22em; flex-shrink: 0; }

        .deck {
          --deck-max-h: min(42dvh, 17rem, calc(100dvh - 13rem));
          width: min(74vw, 17rem, calc(var(--deck-max-h) * 5 / 7));
          height: auto;
          max-height: var(--deck-max-h);
        }

        .face { padding: 0.85rem 1rem 1rem; }
        .card-symbol svg { width: 58%; max-width: 7.5rem; }
        .card-divider { margin: 0.2rem auto 0.45rem; }

        .question {
          font-size: clamp(1.15rem, 5.2vw, 1.45rem);
          line-height: 1.4;
          max-width: 100%;
        }
        .face.blank-face .question { font-size: clamp(1.35rem, 6.4vw, 1.7rem); }

        .hint { font-size: 0.78rem; flex-shrink: 0; }

        .btn {
          font-size: 0.82rem;
          padding: 0.72rem 1.5rem;
          letter-spacing: 0.1em;
          min-height: 2.75rem;
        }

        .footer-info {
          bottom: max(0.5rem, env(safe-area-inset-bottom));
          font-size: 0.62rem;
          letter-spacing: 0.14em;
          gap: 1rem;
        }
      }

      @media (max-width: 540px) and (max-height: 680px) {
        .stage { padding-top: max(2.6rem, calc(env(safe-area-inset-top) + 2.3rem)); gap: 0.3rem; }
        .deck {
          --deck-max-h: min(36dvh, 14rem, calc(100dvh - 11.5rem));
          width: min(66vw, 14.5rem, calc(var(--deck-max-h) * 5 / 7));
        }
        .eyebrow { display: none; }
        .hint { font-size: 0.72rem; }
        .face { padding: 0.65rem 0.85rem 0.75rem; }
        .card-symbol svg { width: 50%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .card { transition-duration: 0.01ms; }
      }
    </style>
  </head>

        { q: "＿人", kind: "blank" },
        { q: "＿手", kind: "blank" },
        { q: "＿星", kind: "blank" },
        { q: "＿神", kind: "blank" },
        { q: "＿王", kind: "blank" },
        { q: "＿貓", kind: "blank" },
        { q: "＿狗", kind: "blank" },
        { q: "＿魚", kind: "blank" },
        { q: "＿鳥", kind: "blank" },
        { q: "＿虎", kind: "blank" },
        { q: "＿馬", kind: "blank" },
        { q: "＿水", kind: "blank" },
        { q: "＿花", kind: "blank" },
        { q: "＿風", kind: "blank" },
        { q: "＿雨", kind: "blank" },
        { q: "＿光", kind: "blank" },
        { q: "＿火", kind: "blank" },
        { q: "＿雲", kind: "blank" },
        { q: "＿海", kind: "blank" },
        { q: "＿石", kind: "blank" },
        { q: "夜＿", kind: "blank" },
        { q: "心＿", kind: "blank" },
        { q: "天＿", kind: "blank" },
        { q: "太＿", kind: "blank" },
        { q: "＿車", kind: "blank" },
        { q: "＿機", kind: "blank" },
        { q: "＿門", kind: "blank" },
        { q: "＿房", kind: "blank" },
        { q: "＿床", kind: "blank" },
        { q: "＿袋", kind: "blank" },
        { q: "＿鞋", kind: "blank" },
        { q: "＿衫", kind: "blank" },
      ];

      const KIND_LABEL = { prompt: "默契題", blank: "填空題" };
      const KIND_HINT = {
        prompt: "各自寫一個答案",
        blank: "各自填一個詞"
      };
      const FILTERS = [
        { k: "all",    label: "全部" },
        { k: "prompt", label: "默契題" },
        { k: "blank",  label: "填空題" },
      ];

      const kindOf = p => (p.kind === "blank" ? "blank" : "prompt");

      // --- Procedural symbol generator (Matisse cutout style) ---------
      function rng(seed) {
        let s = (seed | 0) || 1;
        return () => {
          s = Math.imul(s ^ s >>> 15, s | 1);
          s ^= s + Math.imul(s ^ s >>> 7, s | 61);
          return ((s ^ s >>> 14) >>> 0) / 4294967296;
        };
      }
      function blobPath(cx, cy, r, complexity, irregularity, rand) {
        const pts = [];
        for (let i = 0; i < complexity; i++) {
          const angle = (i / complexity) * Math.PI * 2 + (rand() - 0.5) * 0.3;
          const radius = r * (1 - irregularity + rand() * irregularity * 2);
          pts.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius });
        }
        // Catmull-Rom -> cubic bezier, closed
        const n = pts.length;
        let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} `;
        for (let i = 0; i < n; i++) {
          const p0 = pts[(i - 1 + n) % n];
          const p1 = pts[i];
          const p2 = pts[(i + 1) % n];
          const p3 = pts[(i + 2) % n];
          const c1x = p1.x + (p2.x - p0.x) / 6;
          const c1y = p1.y + (p2.y - p0.y) / 6;
          const c2x = p2.x - (p3.x - p1.x) / 6;
          const c2y = p2.y - (p3.y - p1.y) / 6;
          d += `C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)} `;
        }
        return d + "Z";
      }
      function generateSymbolSVG() {
        const seed = (Math.random() * 1e9) | 0;
        const r = rng(seed);
        const VB = 100;
        const cx = VB / 2, cy = VB / 2;
        const paths = [];
        const type = Math.floor(r() * 5);

        if (type === 0) {
          paths.push(blobPath(cx, cy, 28 + r() * 8, 7 + Math.floor(r() * 5), 0.25 + r() * 0.3, r));
        } else if (type === 1) {
          paths.push(blobPath(cx, cy, 26 + r() * 6, 10 + Math.floor(r() * 4), 0.55 + r() * 0.3, r));
        } else if (type === 2) {
          const dx = 8 + r() * 6, dy = 6 + r() * 5;
          paths.push(blobPath(cx - dx, cy - dy, 18 + r() * 4, 8, 0.3 + r() * 0.2, r));
          paths.push(blobPath(cx + dx, cy + dy, 14 + r() * 4, 7, 0.35 + r() * 0.2, r));
        } else if (type === 3) {
          const count = 3 + Math.floor(r() * 3);
          const orbit = 18 + r() * 6;
          for (let i = 0; i < count; i++) {
            const ang = (i / count) * Math.PI * 2 + r() * 0.4;
            paths.push(blobPath(cx + Math.cos(ang) * orbit, cy + Math.sin(ang) * orbit,
                                7 + r() * 5, 6 + Math.floor(r() * 3), 0.25 + r() * 0.25, r));
          }
        } else {
          paths.push(blobPath(cx - 6, cy + 2, 24 + r() * 5, 8, 0.3 + r() * 0.2, r));
          paths.push(blobPath(cx + 18, cy - 16, 6 + r() * 4, 7, 0.4, r));
        }

        const inner = paths.map(d => `<path d="${d}" fill="currentColor" />`).join("");
        return `<svg viewBox="0 0 ${VB} ${VB}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
      }

      // --- Deck ---------------------------------------------------------
      const deckEl   = document.getElementById("deck");
      const hintEl   = document.getElementById("hint");
      const kindEl   = document.getElementById("kindLabel");
      const countEl  = document.getElementById("deckCount");
      const pillsEl  = document.getElementById("pills");

      let filter = "all";
      let pool = [];      // 未抽的題目，抽完自動重洗
      let drawn = 0;      // 這副牌已抽的題數
      let order = [...deckEl.querySelectorAll(".card")];  // order[0] = 面頂那張
      let onDeck = null;  // 已經寫喺 order[1] 度、下一張會上場的題目
      let busy = false;

      const inFilter = p => filter === "all" || kindOf(p) === filter;

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function refill() {
        pool = shuffle(BANK.filter(inFilter).slice());
        drawn = 0;
      }
      function renderCount() {
        const total = BANK.filter(inFilter).length;
        countEl.textContent = `${drawn} / ${total}`;
      }

      FILTERS.forEach(f => {
        const n = f.k === "all" ? BANK.length : BANK.filter(p => kindOf(p) === f.k).length;
        const b = document.createElement("button");
        b.className = "pill";
        b.type = "button";
        b.dataset.k = f.k;
        b.setAttribute("aria-pressed", String(f.k === filter));
        b.innerHTML = `${f.label}<span class="n">${n}</span>`;
        b.onclick = () => {
          if (filter === f.k) return;
          filter = f.k;
          [...pillsEl.children].forEach(el =>
            el.setAttribute("aria-pressed", String(el.dataset.k === filter)));
          refill();
          preload();     // 換咗題型，牌堆下一張要即刻換返啱
          renderCount();
          next();
        };
        pillsEl.appendChild(b);
      });

      function faceHTML(pick) {
        const kind = kindOf(pick);
        const body = kind === "blank"
          ? pick.q.replace(/＿/g, '<span class="blank"></span>')
          : pick.q;
        return `<div class="face${kind === "blank" ? " blank-face" : ""}">
              <div class="card-symbol" aria-hidden="true">${generateSymbolSVG()}</div>
              <div class="card-divider" aria-hidden="true"></div>
              <p class="question">${body}</p>
            </div>`;
      }

      function applyRoles() {
        order.forEach((c, i) => {
          c.dataset.pos = i;
          if (i === 0) {
            c.setAttribute("role", "button");
            c.setAttribute("tabindex", "0");
            c.setAttribute("aria-label", "下一題");
            c.removeAttribute("aria-hidden");
          } else {
            c.removeAttribute("role");
            c.removeAttribute("tabindex");
            c.removeAttribute("aria-label");
            c.setAttribute("aria-hidden", "true");
          }
        });
      }

      // 下一題預先寫喺牌堆第二張度，所以一掃開面頂張牌就見到，
      // 唔使等放手先 render。
      function preload() {
        if (!pool.length) refill();
        onDeck = pool.pop();
        order[1].innerHTML = faceHTML(onDeck);
      }

      // 抽下一題：面頂那張飛走，下面牌堆嗰張（已經寫好題目）升上嚟。
      // ux / uy = 飛走方向（掃出嘅向量），預設向上。
      function next(ux = 0, uy = -1) {
        if (busy) return;
        if (!onDeck) preload();
        const pick = onDeck;
        drawn++;
        busy = true;

        const outgoing = order[0];

        const kind = kindOf(pick);
        kindEl.textContent = KIND_LABEL[kind];
        hintEl.textContent = KIND_HINT[kind];

        const len = Math.hypot(ux, uy) || 1;
        const dist = Math.max(deckEl.offsetWidth, deckEl.offsetHeight) * 1.5;
        outgoing.classList.remove("dragging");
        outgoing.classList.add("gone");
        outgoing.style.transform =
          `translate3d(${(ux / len * dist).toFixed(0)}px, ${(uy / len * dist).toFixed(0)}px, 0)` +
          ` rotate(${(ux / len * 16 - 4).toFixed(1)}deg) scale(1.02)`;

        order = [order[1], order[2], order[0]];
        applyRoles();
        renderCount();

        // 面頂換咗之後，即刻再排定下一題喺第二張牌
        onDeck = null;
        preload();

        const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 480;
        setTimeout(() => {
          // 飛走那張洗返落牌堆底
          outgoing.classList.add("no-anim");
          outgoing.classList.remove("gone");
          outgoing.style.transform = "";
          ["--dx", "--dy", "--tilt"].forEach(v => outgoing.style.removeProperty(v));
          outgoing.innerHTML = "";
          void outgoing.offsetWidth;
          outgoing.classList.remove("no-anim");
          busy = false;
        }, wait);
      }

      // --- 點一下 / 掃一下都是下一題 --------------------------------
      const SWIPE = 52;   // 掃夠這個距離就抽牌
      const SLOP  = 8;    // 超過這個距離就當作掃，不再當作點擊
      let drag = null;

      function setDrag(card, dx, dy) {
        card.style.setProperty("--dx", dx.toFixed(1) + "px");
        card.style.setProperty("--dy", dy.toFixed(1) + "px");
        card.style.setProperty("--tilt", (dx / 26).toFixed(2) + "deg");
      }
      const onTop = t => order[0] === t || order[0].contains(t);

      deckEl.addEventListener("pointerdown", e => {
        if (busy || e.button > 0 || !onTop(e.target)) return;
        const card = order[0];
        drag = { x: e.clientX, y: e.clientY, id: e.pointerId, card, moved: false };
        try { card.setPointerCapture(e.pointerId); } catch {}
        card.classList.add("dragging");
      });

      deckEl.addEventListener("pointermove", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        if (Math.abs(dx) > SLOP || Math.abs(dy) > SLOP) drag.moved = true;
        setDrag(drag.card, dx * 0.85, dy * 0.5);
      });

      deckEl.addEventListener("pointerup", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        const card = drag.card;
        deckEl.dataset.swiped = drag.moved ? "1" : "";
        drag = null;
        card.classList.remove("dragging");
        if (Math.hypot(dx, dy) >= SWIPE) {
          next(dx, dy);              // 沿住掃出方向飛走
        } else {
          setDrag(card, 0, 0);       // 未夠距離就彈返原位
        }
      });

      deckEl.addEventListener("pointercancel", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const card = drag.card;
        drag = null;
        card.classList.remove("dragging");
        setDrag(card, 0, 0);
      });

      deckEl.addEventListener("click", e => {
        if (!onTop(e.target)) return;
        if (deckEl.dataset.swiped) { deckEl.dataset.swiped = ""; return; }  // 掃完唔好再抽多張
        next();
      });
      deckEl.addEventListener("keydown", e => {
        if (e.target !== order[0]) return;
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); }
      });

      document.getElementById("nextBtn").addEventListener("click", () => next());
      document.getElementById("shuffleBtn").addEventListener("click", () => {
        refill();
        preload();
        renderCount();
        next();
      });

      refill();
      preload();
      renderCount();
    </script>
  </body>
</html>
