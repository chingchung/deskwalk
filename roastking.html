<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Roast King · 吐糟王 · deskwalk</title>
<link rel="stylesheet" href="brand.css" />
<style>
  :root{
    /* primary action maps to the deskwalk brand accent */
    --slap:var(--accent); --slap-deep:var(--accent-deep);
    --done:#1FB07A; --good:#1E64FF;
  }
  html,body{height:100%;}
  body{ -webkit-font-smoothing:antialiased; line-height:1.5; }
  #app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:max(52px,calc(env(safe-area-inset-top) + 40px)) 16px max(22px,env(safe-area-inset-bottom));}
  button{border:none;background:none;color:inherit;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand b{font-size:13px;letter-spacing:.22em;font-weight:800;color:var(--slap);}
  .brand span{font-size:11px;letter-spacing:.16em;color:var(--ink-soft);font-weight:600;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-weight:900;
    font-size:18px;letter-spacing:.02em;padding:16px;border-radius:14px;background:var(--ink);color:var(--paper);
    box-shadow:0 8px 18px -8px rgba(26,23,18,.32);transition:transform .06s,box-shadow .06s;}
  .btn:active{transform:translateY(3px);box-shadow:0 4px 10px -6px rgba(26,23,18,.3);}
  .btn--slap{background:var(--slap);box-shadow:var(--shadow-pop);}
  .btn--slap:active{box-shadow:var(--shadow-press);}
  .btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:15px;padding:13px;}
  .btn--ghost:active{transform:translateY(2px);}
  .muted{color:var(--ink-soft);font-size:13px;}

  /* ---------------- HOST ---------------- */
  .host-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:3px;gap:2px;}
  .seg button{font-size:13px;font-weight:800;padding:7px 14px;border-radius:30px;color:var(--ink-soft);white-space:nowrap;}
  .seg button.on{background:var(--ink);color:var(--paper);}

  .topicwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 20px 24px;position:relative;margin-bottom:16px;overflow:hidden;}
  .topicwrap::before{content:"而家吐緊呢題";position:absolute;top:14px;right:16px;font-size:11px;font-weight:800;
    letter-spacing:.16em;color:var(--slap);}
  .topicwrap .tnum{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--ink-soft);}
  .topicwrap .tq{font-size:clamp(24px,6.6vw,32px);font-weight:900;line-height:1.24;margin:12px 0 0;letter-spacing:-.01em;}
  .topnav{display:flex;gap:10px;margin-bottom:18px;}
  .topnav .btn{font-size:15px;padding:13px;}

  .qrcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;text-align:center;margin-bottom:16px;}
  .qrcard .lead{font-size:15px;font-weight:900;margin-bottom:4px;}
  .qrcard .lead em{color:var(--slap);font-style:normal;}
  .qrcard .sub{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:14px;}
  .qrframe{display:inline-block;background:#fff;padding:12px;border-radius:14px;border:1px solid var(--line);
    box-shadow:var(--shadow);transform:rotate(-1.5deg);}
  .qrframe img{display:block;width:min(220px,58vw);height:auto;image-rendering:pixelated;}
  .qrurl{margin-top:14px;font-size:11.5px;color:var(--ink-soft);word-break:break-all;font-weight:600;
    background:var(--paper);border:1px dashed var(--line);border-radius:9px;padding:8px 10px;}
  .qrhint{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
  .qrhint b{color:var(--ink);}

  /* ---------------- PLAYER / hand ---------------- */
  .p-topic{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:8px;position:relative;}
  .p-topic span{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--slap);display:block;margin-bottom:6px;}
  .p-topic .q{font-size:clamp(19px,5vw,23px);font-weight:900;line-height:1.3;letter-spacing:-.01em;}
  .progress{display:flex;align-items:center;gap:10px;margin:14px 2px 12px;}
  .progress .bar{flex:1;height:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .progress .fill{height:100%;background:var(--slap);width:0;transition:width .35s cubic-bezier(.2,.9,.3,1);}
  .progress .pn{font-size:13px;font-weight:900;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .deal-note{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:0 2px 12px;line-height:1.5;}

  .cards{display:flex;flex-direction:column;gap:11px;}
  .lc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 13px;
    text-align:left;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s,opacity .2s;}
  .lc:active{transform:translateY(2px);box-shadow:0 4px 10px -6px rgba(26,23,18,.25);}
  .lc .line{font-size:19px;font-weight:900;line-height:1.32;letter-spacing:-.01em;}
  .lc .hint{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:7px;line-height:1.35;}
  .lc .foot{margin-top:10px;font-size:12.5px;font-weight:900;letter-spacing:.02em;min-height:18px;display:flex;align-items:center;gap:6px;}
  .lc .foot .taphint{color:var(--ink-soft);}

  /* armed */
  .lc.arm{border-color:var(--slap);box-shadow:0 0 0 3px rgba(255,39,94,.18),0 3px 0 var(--slap-deep);transform:translateY(-1px);}
  .lc.arm .foot{color:var(--slap);}
  /* done */
  .lc.done{opacity:.62;border-color:var(--line);border-style:dashed;box-shadow:none;}
  .lc.done .line{text-decoration:line-through;text-decoration-color:var(--slap);text-decoration-thickness:3px;}
  .lc.done .foot{color:var(--done);}
  .lc.unarm{opacity:1;border-color:var(--hl);border-style:solid;box-shadow:0 0 0 3px rgba(255,226,77,.4),0 3px 0 var(--line);}
  .lc.unarm .line{text-decoration:line-through;text-decoration-color:var(--ink-soft);}
  .lc.unarm .foot{color:#A8861A;}
  .stamp{position:absolute;top:-10px;right:-8px;background:var(--done);color:#fff;font-weight:900;font-size:13px;
    padding:5px 11px;border-radius:30px;transform:rotate(9deg);border:1px solid var(--line);}
  .stamp.in{animation:slapIn .4s cubic-bezier(.2,1.3,.4,1);}
  @keyframes slapIn{0%{transform:scale(1.7) rotate(-10deg);opacity:0}60%{transform:scale(.94) rotate(9deg);opacity:1}100%{transform:scale(1) rotate(9deg)}}

  .clearbanner{background:var(--ink);color:var(--paper);border-radius:16px;padding:18px;text-align:center;margin:14px 0 4px;
    animation:slapIn .45s cubic-bezier(.2,1.3,.4,1);}
  .clearbanner .big{font-size:22px;font-weight:900;letter-spacing:-.01em;}
  .clearbanner .crown{font-size:30px;}
  .clearbanner .sm{font-size:13px;opacity:.85;margin-top:4px;}

  .toolbar{display:flex;gap:10px;margin-top:16px;}
  .toolbar .btn{font-size:14px;padding:12px;}
  .foot-note{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:auto;padding-top:18px;line-height:1.5;}
  .foot-note b{color:var(--slap);}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

      for (var r = 8; r < _moduleCount - 8; r += 1) {

        }

const HAND_SIZE = 5;
const app = document.getElementById('app');
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const shuffle = (a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const clampTopic = (n)=>{n=parseInt(n,10);return isNaN(n)?0:((n%TOPICS.length)+TOPICS.length)%TOPICS.length;};

/* QR */
function makeQR(url){
  try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); return qr.createDataURL(8,3); }
  catch(e){ return null; }
}
function playerURL(t){
  const base = location.origin==='null' || location.protocol==='file:'
    ? location.href.split('?')[0].split('#')[0]
    : location.origin + location.pathname;
  return base + '?play&t=' + t;
}

/* hand state machine（兩段式：撳一下點選，再撳一下確認，防誤觸） */
let armTimer=null;
function dealHand(t){ return shuffle(LINES.map((_,i)=>i)).slice(0,HAND_SIZE).map(li=>({li,status:'idle'})); }
function disarmAll(hand){ hand.forEach(c=>{ if(c.status==='arm')c.status='idle'; else if(c.status==='unarm')c.status='done'; }); }
function tapCard(hand,i,rerender){
  const c=hand[i]; clearTimeout(armTimer);
  if(c.status==='idle'){ disarmAll(hand); c.status='arm'; armRevert(hand,i,rerender); }
  else if(c.status==='arm'){ c.status='done'; }
  else if(c.status==='done'){ disarmAll(hand); c.status='unarm'; armRevert(hand,i,rerender); }
  else if(c.status==='unarm'){ c.status='idle'; }
  rerender();
}
function armRevert(hand,i,rerender){ armTimer=setTimeout(()=>{ const c=hand[i];
  if(c.status==='arm')c.status='idle'; else if(c.status==='unarm')c.status='done'; rerender(); },4500); }

function renderHand(mount, hand, rerender){
  const wrap=$(`<div></div>`);
  const done=hand.filter(c=>c.status==='done').length;
  const prog=$(`<div class="progress"><div class="bar"><div class="fill"></div></div><div class="pn">${done} / ${HAND_SIZE} 出咗</div></div>`);
  prog.querySelector('.fill').style.width=(done/HAND_SIZE*100)+'%';
  wrap.appendChild(prog);
  wrap.appendChild($(`<div class="deal-note">傾偈嗰陣，搵窿將下面嘅吐槽塞入去。講得出 → 撳一下、再撳一下確認 ✓</div>`));

  if(done===HAND_SIZE){
    wrap.appendChild($(`<div class="clearbanner"><div class="crown">👑</div><div class="big">五句全部出晒！</div><div class="sm">呢鋪你係吐糟王。換 5 句再嚟一鋪？</div></div>`));
  }

  const cards=$(`<div class="cards"></div>`);
  hand.forEach((c,i)=>{
    const [line,hint]=LINES[c.li];
    const el=$(`<button class="lc ${c.status}"></button>`);
    let inner=`<div class="line"></div><div class="hint"></div><div class="foot"></div>`;
    if(c.status==='done'||c.status==='unarm') inner=`<div class="stamp ${c.status==='done'?'in':''}">搞掂 ✓</div>`+inner;
    el.innerHTML=inner;
    el.querySelector('.line').textContent=line;
    el.querySelector('.hint').textContent=hint;
    const foot=el.querySelector('.foot');
    foot.textContent = c.status==='arm' ? '再撳一下 = 確認完成 ✓'
      : c.status==='unarm' ? '再撳一下 = 取消'
      : c.status==='done' ? '已出 · 撳一下想取消'
      : '';
    if(c.status==='idle'){ const t=document.createElement('span'); t.className='taphint'; t.textContent='撳一下標記完成'; foot.appendChild(t); }
    el.onclick=()=>tapCard(hand,i,rerender);
    cards.appendChild(el);
  });
  wrap.appendChild(cards);
  mount.appendChild(wrap);
}

/* ---------------- PLAYER VIEW ---------------- */
let playerHand=null, playerTopic=0;
function renderPlayer(){
  app.innerHTML='';
  const reroll=()=>{ playerHand=dealHand(playerTopic); renderPlayer(); };
  const top=$(`<div></div>`);
  top.appendChild($(`<div class="brand" style="margin-bottom:14px"><b>吐糟王</b><span>你嘅 5 句</span></div>`));
  const tp=$(`<div class="p-topic"><span>而家吐緊呢題</span><div class="q"></div></div>`);
  tp.querySelector('.q').textContent=TOPICS[playerTopic];
  top.appendChild(tp);
  app.appendChild(top);

  renderHand(app, playerHand, renderPlayer);

  const tb=$(`<div class="toolbar"></div>`);
  const rb=$(`<button class="btn btn--slap">換 5 句</button>`); rb.onclick=reroll;
  tb.appendChild(rb);
  app.appendChild(tb);
  app.appendChild($(`<div class="foot-note">題目跟你 scan 嗰陣鎖定。<b>想換題目就再 scan 一次</b>個 QR，或者望主持部機／大電視。</div>`));
}

/* ---------------- HOST VIEW ---------------- */
let hostTopic=0, hostOrder=null, hostMode='table', hostHand=null;
function renderHost(){
  app.innerHTML='';
  if(!hostOrder) hostOrder = TOPICS.map((_,i)=>i); // 順序，可洗
  const head=$(`<div class="host-head"></div>`);
  head.appendChild($(`<div class="brand"><b>吐糟王</b><span>主持台</span></div>`));
  const seg=$(`<div class="seg"></div>`);
  const b1=$(`<button class="${hostMode==='table'?'on':''}">QR · 出題</button>`);
  const b2=$(`<button class="${hostMode==='play'?'on':''}">我都要玩</button>`);
  b1.onclick=()=>{hostMode='table';renderHost();};
  b2.onclick=()=>{hostMode='play'; if(!hostHand)hostHand=dealHand(hostTopic); renderHost();};
  seg.appendChild(b1); seg.appendChild(b2);
  head.appendChild(seg);
  app.appendChild(head);

  // 題目卡（兩個 mode 都顯示）
  const tw=$(`<div class="topicwrap"><div class="tnum"></div><div class="tq"></div></div>`);
  tw.querySelector('.tnum').textContent=`題目 ${String(hostTopic+1).padStart(2,'0')} / ${TOPICS.length}`;
  tw.querySelector('.tq').textContent=TOPICS[hostTopic];
  app.appendChild(tw);

  const nav=$(`<div class="topnav"></div>`);
  const prev=$(`<button class="btn btn--ghost">← 上一題</button>`);
  const next=$(`<button class="btn">下一題 →</button>`);
  prev.onclick=()=>changeTopic(-1); next.onclick=()=>changeTopic(1);
  nav.appendChild(prev); nav.appendChild(next);
  app.appendChild(nav);

  if(hostMode==='table'){
    const url=playerURL(hostTopic);
    const data=makeQR(url);
    const qc=$(`<div class="qrcard"><div class="lead">叫大家 <em>scan</em> 入嚟</div><div class="sub">scan 完手機會自動派 5 句 + 呢題</div></div>`);
    if(data){ const fr=$(`<div class="qrframe"><img alt="掃我加入"></div>`); fr.querySelector('img').src=data; qc.appendChild(fr); }
    else qc.appendChild($(`<div class="muted">QR 產生唔到，叫大家照下面條 link 入。</div>`));
    const u=$(`<div class="qrurl"></div>`); u.textContent=url; qc.appendChild(u);
    qc.appendChild($(`<div class="qrhint">轉題目會更新 QR。<b>已經 join 咗嘅人想轉題，re-scan 一下</b>，或者望住主持機就得。</div>`));
    app.appendChild(qc);
    const shuf=$(`<button class="btn btn--ghost" style="margin-top:2px">洗一洗題目順序</button>`);
    shuf.onclick=()=>{ hostOrder=shuffle(TOPICS.map((_,i)=>i)); hostTopic=hostOrder[0]; renderHost(); };
    app.appendChild(shuf);
    app.appendChild($(`<div class="foot-note">部機擺中間或者投上電視都得。你 host 都想玩 → 撳上面「我都要玩」。</div>`));
  } else {
    renderHand(app, hostHand, renderHost);
    const tb=$(`<div class="toolbar"></div>`);
    const rb=$(`<button class="btn btn--slap">換 5 句</button>`); rb.onclick=()=>{hostHand=dealHand(hostTopic);renderHost();};
    const bk=$(`<button class="btn btn--ghost">← 返主持台</button>`); bk.onclick=()=>{hostMode='table';renderHost();};
    tb.appendChild(rb); tb.appendChild(bk);
    app.appendChild(tb);
    app.appendChild($(`<div class="foot-note">你同其他人玩法一樣：講得出就撳完成。<b>唔使計分，睇大家反應就知抵唔抵。</b></div>`));
  }
}
function changeTopic(d){
  hostTopic = clampTopic(hostTopic + d);
  hostHand = null;            // 轉題重新派 host 手牌
  renderHost();
}

/* ---------------- 路由 ---------------- */
(function init(){
  const p=new URLSearchParams(location.search);
  if(p.has('play')){
    playerTopic=clampTopic(p.get('t')||0);
    playerHand=dealHand(playerTopic);
    renderPlayer();
  } else {
    hostTopic=0; renderHost();
  }
})();
