<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心靈共感 · deskwalk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Tinted neutrals toward violet hue 305 */
        --bg: oklch(0.16 0.018 305);
        --bg-deep: oklch(0.11 0.022 305);
        --surface: oklch(0.21 0.022 305);
        --ink: oklch(0.94 0.012 80);
        --ink-soft: oklch(0.68 0.018 305);
        --ink-faint: oklch(0.45 0.02 305);
        --line: oklch(0.28 0.022 305);
        /* Level moods: dusk → ember → midnight */
        --l1: oklch(0.78 0.09 175);  /* dusk jade */
        --l2: oklch(0.82 0.13 75);   /* ember amber */
        --l3: oklch(0.74 0.18 320);  /* midnight violet */
        --accent: oklch(0.74 0.18 320);
        --glow: oklch(0.74 0.18 320 / 0.35);
        --serif: "Cormorant Garamond", "Songti TC", "Noto Serif TC", serif;
        --sans: "Inter", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        margin: 0;
        font-size: 16px;
        font-weight: 300;
        letter-spacing: 0.01em;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
      }
      /* Ambient vignette — radial warmth from center, deep edges */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 35%,
          oklch(0.24 0.04 320) 0%,
          var(--bg) 40%,
          var(--bg-deep) 100%
        );
        z-index: -1;
        pointer-events: none;
      }
      /* Subtle starlit grain — pure CSS, no images */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 17% 23%, oklch(0.9 0.05 80 / 0.5) 50%, transparent 100%),
          radial-gradient(1px 1px at 64% 12%, oklch(0.85 0.08 320 / 0.4) 50%, transparent 100%),
          radial-gradient(1px 1px at 84% 71%, oklch(0.9 0.05 80 / 0.4) 50%, transparent 100%),
          radial-gradient(1px 1px at 23% 84%, oklch(0.85 0.08 320 / 0.3) 50%, transparent 100%),
          radial-gradient(1px 1px at 47% 56%, oklch(0.9 0.05 80 / 0.25) 50%, transparent 100%),
          radial-gradient(1px 1px at 91% 33%, oklch(0.9 0.05 80 / 0.4) 50%, transparent 100%);
        z-index: -1;
        pointer-events: none;
      }

      .stage {
        max-width: 560px;
        margin: 0 auto;
        padding: 3rem 1.75rem 6rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        min-height: 100vh;
      }

      /* HEADER — counter + progress */
      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 4rem;
        gap: 2rem;
      }
      .counter {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
      }
      .counter .num {
        font-family: var(--serif);
        font-size: 2.75rem;
        font-weight: 300;
        line-height: 1;
        color: var(--ink);
        font-variant-numeric: lining-nums tabular-nums;
        transition: color 0.6s ease;
      }
      .counter .num.pop {
        color: var(--accent);
      }
      .counter .num-label {
        font-size: 0.74rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-faint);
        font-weight: 400;
      }
      .progress {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5rem;
      }
      .level-dots {
        display: flex;
        gap: 0.5rem;
      }
      .dot {
        font-family: var(--serif);
        font-style: italic;
        font-size: 0.95rem;
        color: var(--ink-faint);
        width: 1.5rem;
        height: 1.5rem;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: default;
      }
      .dot.active {
        color: var(--bg-deep);
        background: var(--ink);
        border-color: var(--ink);
      }
      .dot.done {
        color: var(--accent);
        border-color: var(--accent);
        background: transparent;
      }
      .phase-label {
        font-size: 0.74rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .threshold {
        font-size: 0.78rem;
        color: var(--ink-faint);
        margin-top: 0.25rem;
        font-style: italic;
        font-family: var(--serif);
        text-align: right;
        max-width: 14rem;
      }
      .strikes {
        display: flex;
        gap: 0.3rem;
        margin-top: 0.4rem;
        align-self: flex-end;
      }
      .strikes .strike {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 999px;
        background: var(--line);
        transition: background 0.4s ease;
      }
      .strikes .strike.lit {
        background: var(--accent);
        box-shadow: 0 0 6px var(--glow);
      }
      .strikes.warn .strike.lit {
        background: oklch(0.74 0.2 25);
        box-shadow: 0 0 8px oklch(0.74 0.2 25 / 0.45);
      }

      /* QUESTION */
      .question-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1.5rem;
        padding: 1rem 0;
        transition: opacity 0.4s ease;
      }
      .question-block.dim { opacity: 0.25; }
      .eyebrow {
        font-size: 0.74rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0;
      }
      .question {
        font-family: var(--serif);
        font-weight: 300;
        font-size: clamp(2rem, 6vw, 2.85rem);
        line-height: 1.3;
        color: var(--ink);
        margin: 0;
        max-width: 22ch;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .question .count {
        font-style: italic;
        font-weight: 400;
        color: var(--accent);
        padding: 0 0.05em;
      }
      .question.flip {
        opacity: 0;
        transform: translateY(12px);
      }
      .hint {
        font-family: var(--serif);
        font-style: italic;
        font-size: 0.95rem;
        color: var(--ink-soft);
        margin: 0;
        letter-spacing: 0.04em;
      }
      .placeholder {
        font-family: var(--serif);
        font-style: italic;
        color: var(--ink-faint);
      }

      /* ACTIONS */
      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        margin-top: 2rem;
      }
      .verdict {
        display: none;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .verdict.show { display: flex; }
      .btn {
        font-family: var(--sans);
        font-size: 0.95rem;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0.95rem 2rem;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: inherit;
      }
      .btn-primary {
        background: var(--ink);
        color: var(--bg-deep);
        border: 1px solid var(--ink);
        box-shadow: 0 0 0 0 var(--glow);
      }
      .btn-primary:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--ink);
        box-shadow: 0 0 32px -4px var(--glow);
      }
      .btn-ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }
      .btn-ghost:hover {
        color: var(--ink);
        border-color: var(--ink-soft);
      }

      /* OVERLAYS */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: oklch(0.11 0.02 305 / 0.92);
        display: grid;
        place-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .overlay.show { opacity: 1; pointer-events: auto; }
      .overlay-inner {
        text-align: center;
        max-width: 28rem;
        padding: 2rem;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                    transform 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
      }
      .overlay.show .overlay-inner { opacity: 1; transform: translateY(0); }
      .overlay.demotion {
        background: oklch(0.09 0.025 25 / 0.94);
      }
      .overlay.demotion .overlay-title .roman {
        color: oklch(0.72 0.16 25);
      }
      .overlay.demotion .overlay-sub {
        color: oklch(0.6 0.06 25);
      }
      .overlay-eyebrow {
        font-size: 0.78rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0 0 1.5rem;
      }
      .overlay-title {
        font-family: var(--serif);
        font-weight: 300;
        font-size: 3rem;
        line-height: 1.2;
        margin: 0 0 0.5rem;
        color: var(--ink);
      }
      .overlay-title .roman {
        font-style: italic;
        color: var(--accent);
      }
      .overlay-sub {
        font-family: var(--serif);
        font-style: italic;
        font-size: 1.1rem;
        color: var(--ink-soft);
        margin: 0;
      }

      /* FINALE */
      .finale-count {
        font-family: var(--serif);
        font-size: 5.5rem;
        font-weight: 300;
        color: var(--accent);
        margin: 1.5rem 0 0.5rem;
        line-height: 1;
      }
      .finale-caption {
        font-family: var(--serif);
        font-size: 1.15rem;
        font-style: italic;
        color: var(--ink-soft);
        margin: 0 0 2rem;
      }
      .finale-stars {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
        flex-wrap: wrap;
        margin: 1rem 0 2.5rem;
        max-width: 22rem;
      }
      .finale-stars svg {
        width: 1.5rem;
        height: 1.5rem;
        filter: drop-shadow(0 0 8px var(--glow));
        opacity: 0;
        animation: starFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes starFadeIn {
        from { opacity: 0; transform: scale(0.5) rotate(-15deg); }
        to   { opacity: 1; transform: scale(1) rotate(0); }
      }

      /* FOOTER */
      .footer-info {
        position: fixed;
        bottom: 1.25rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-faint);
        pointer-events: none;
      }
      .footer-info a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
        border-bottom: 1px solid transparent;
        padding-bottom: 1px;
        transition: border-color 0.2s;
      }
      .footer-info a:hover { border-color: var(--ink-soft); color: var(--ink-soft); }
      .reset {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        pointer-events: auto;
        margin-left: 1.5rem;
      }
      .reset:hover { color: var(--ink-soft); }

      /* Phase tint applied to active question */
      .stage[data-level="1"] .question .count { color: var(--l1); }
      .stage[data-level="2"] .question .count { color: var(--l2); }
      .stage[data-level="3"] .question .count { color: var(--l3); }
      .stage[data-level="3"] .question {
        font-style: italic;
        font-size: clamp(2.2rem, 7vw, 3.25rem);
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage" data-level="1">

      <header class="head">
        <div class="counter">
          <span class="num" id="totalCount">0</span>
          <span class="num-label">共感</span>
        </div>
        <div class="progress">
          <div class="level-dots">
            <span class="dot active" data-level="1">I</span>
            <span class="dot" data-level="2">II</span>
            <span class="dot" data-level="3">III</span>
          </div>
          <span class="threshold" id="thresholdText">第 1 / 3 題</span>
          <span class="strikes" id="strikes" aria-hidden="true"></span>
        </div>
      </header>

      <div class="question-block" id="qBlock">
        <p class="eyebrow" id="phaseLabel">第一階段 · 暖身</p>
        <p class="question placeholder" id="question">準備好了嗎</p>
        <p class="hint" id="hint">按下方開始</p>
      </div>

      <div class="actions">
        <div class="verdict" id="verdict">
          <button class="btn btn-primary" onclick="record(true)">共感達成</button>
          <button class="btn btn-ghost" onclick="record(false)">下一題</button>
        </div>
        <button class="btn btn-primary" id="drawBtn" onclick="draw()">抽 題</button>
      </div>

    </div>

    <!-- Transition overlay between levels (also used for demotion) -->
    <div class="overlay" id="transition">
      <div class="overlay-inner">
        <p class="overlay-eyebrow" id="transitionEyebrow">你們進入</p>
        <p class="overlay-title">第<span class="roman" id="transitionRoman">二</span>階段</p>
        <p class="overlay-sub" id="transitionSub">升溫</p>
      </div>
    </div>

    <!-- Finale overlay -->
    <div class="overlay" id="finale">
      <div class="overlay-inner">
        <p class="overlay-eyebrow">這場儀式完成</p>
        <p class="finale-count" id="finalCount">0</p>
        <p class="finale-caption">個共感被你們共同寫下</p>
        <div class="finale-stars" id="finalStars"></div>
        <button class="btn btn-ghost" onclick="restart()">再走一次</button>
      </div>
    </div>

    <footer class="footer-info">
      <a href="index.html">deskwalk</a>
      <button class="reset" onclick="resetSession()">重置</button>
    </footer>

    <script>
      const BANK = {
        1: [
          { q: "寫出 #{n} 首代表香港的歌", n: 3 },
          { q: "寫出 #{n} 部小時候必看的卡通", n: 3 },
          { q: "寫出 #{n} 樣最有香港味的茶餐廳食物", n: 3 },
          { q: "寫出 #{n} 個一定要帶外國朋友去的香港地點", n: 3 },
          { q: "寫出 #{n} 部最代表香港的電影", n: 3 },
          { q: "寫出 #{n} 個你覺得最香港的食物", n: 3 },
          { q: "寫出 #{n} 個讓你哭過的廣告", n: 3 },
          { q: "寫出 #{n} 個香港人最常用的口頭禪", n: 3 },
          { q: "寫出 #{n} 首婚禮必播的歌", n: 3 },
          { q: "寫出 #{n} 個夜深會去吃的宵夜", n: 3 },
          { q: "寫出 #{n} 個冬天必喝的飲料", n: 3 },
          { q: "寫出 #{n} 個小時候放學會去的地方", n: 3 },
        ],
        2: [
          { q: "寫出 #{n} 個適合做名字的水果", n: 2 },
          { q: "寫出 #{n} 個聽起來很貴但其實便宜的東西", n: 2 },
          { q: "寫出 #{n} 個適合當寵物名字的食物", n: 2 },
          { q: "寫出 #{n} 個最浪漫的家具", n: 2 },
          { q: "寫出 #{n} 個最像天氣的情緒", n: 2 },
          { q: "寫出 #{n} 個最適合做暗號的詞", n: 2 },
          { q: "寫出 #{n} 個最像愛情的飲料", n: 2 },
          { q: "寫出 #{n} 個最不該出現在喪禮的歌", n: 2 },
          { q: "寫出 #{n} 個最像星期一的食物", n: 2 },
          { q: "寫出 #{n} 種你願意當的動物", n: 2 },
          { q: "寫出 #{n} 個最像「孤獨」的物件", n: 2 },
          { q: "寫出 #{n} 個最可能在桌上玩家裡爆紅的人", n: 2 },
          { q: "寫出 #{n} 個最像貓的桌上玩家", n: 2 },
          { q: "寫出 #{n} 個會在半夜傳訊息給你的玩家", n: 2 },
          { q: "寫出 #{n} 個最像深夜便利店的城市", n: 2 },
        ],
        3: [
          { q: "畫一個圖形", n: 1, abstract: true },
          { q: "寫一個顏色", n: 1, abstract: true },
          { q: "寫一個動物", n: 1, abstract: true },
          { q: "寫一個 1 到 10 的數字", n: 1, abstract: true },
          { q: "寫一個字 代表今晚", n: 1, abstract: true },
          { q: "寫一個季節", n: 1, abstract: true },
          { q: "想一個聲音", n: 1, abstract: true },
          { q: "畫一個你想送給大家的禮物", n: 1, abstract: true },
          { q: "寫一個讓人想哭的詞", n: 1, abstract: true },
          { q: "寫一個能形容這群人的字", n: 1, abstract: true },
          { q: "畫一個你心裡的「家」", n: 1, abstract: true },
          { q: "寫一個天氣", n: 1, abstract: true },
          { q: "想一個味道", n: 1, abstract: true },
          { q: "寫一個動作", n: 1, abstract: true },
          { q: "畫一個讓世界停下來的瞬間", n: 1, abstract: true },
        ]
      };

      const ROUNDS = { 1: 3, 2: 2, 3: 1 };  // 每階段題數
      const ROMAN = { 1: "一", 2: "二", 3: "三" };
      const PHASE_NAMES = { 1: "暖身", 2: "升溫", 3: "共感" };
      const STORAGE_KEY = "deskwalk-session-v2";

      function freshSession() {
        return { total: 0, level: 1, round: 0, fails: 0, done: false };
      }
      function loadSession() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEY);
          return raw ? { ...freshSession(), ...JSON.parse(raw) } : freshSession();
        } catch { return freshSession(); }
      }
      function saveSession() { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(session)); }

      let session = loadSession();
      let lastQuestion = null;
      let pendingLevel = null;  // level of currently-shown question (waiting for verdict)
      let busy = false;         // suppress interactions during transitions

      // --- Render -------------------------------------------------------
      function renderCounter() {
        document.getElementById("totalCount").textContent = session.total;
      }
      function renderDots() {
        document.querySelectorAll(".dot").forEach(d => {
          const lv = Number(d.dataset.level);
          d.classList.toggle("active", lv === session.level && !session.done);
          d.classList.toggle("done", session.done && lv <= 3);
        });
      }
      function renderThreshold() {
        const tEl = document.getElementById("thresholdText");
        if (session.done) { tEl.textContent = "儀式完成"; return; }
        const total = ROUNDS[session.level];
        const current = Math.min(session.round + 1, total);
        if (session.level === 3) {
          tEl.textContent = "終局 · 一題定共感";
        } else {
          tEl.textContent = `第 ${current} / ${total} 題`;
        }
      }
      function renderStrikes() {
        const el = document.getElementById("strikes");
        el.innerHTML = "";
        // strikes only meaningful at L2 (2 fails = demote)
        if (session.level !== 2 || session.done) return;
        for (let i = 0; i < 2; i++) {
          const dot = document.createElement("span");
          dot.className = "strike" + (i < session.fails ? " lit" : "");
          el.appendChild(dot);
        }
        el.classList.toggle("warn", session.fails >= 1);
      }
      function renderPhaseLabel() {
        document.getElementById("phaseLabel").textContent =
          `第${ROMAN[session.level]}階段 · ${PHASE_NAMES[session.level]}`;
      }
      function renderAll() {
        renderCounter(); renderDots(); renderThreshold();
        renderStrikes(); renderPhaseLabel();
        document.getElementById("stage").dataset.level = session.level;
      }

      // --- Draw ---------------------------------------------------------
      function resetQuestionToReady() {
        const qEl = document.getElementById("question");
        qEl.classList.add("placeholder");
        qEl.textContent = "準備好了嗎";
        document.getElementById("hint").textContent = "按下方繼續";
        document.getElementById("verdict").classList.remove("show");
        document.getElementById("drawBtn").style.display = "";
        pendingLevel = null;
      }

      function draw() {
        if (busy || session.done) return;
        const bank = BANK[session.level];
        let pick;
        do {
          pick = bank[Math.floor(Math.random() * bank.length)];
        } while (bank.length > 1 && pick === lastQuestion);
        lastQuestion = pick;

        const qEl = document.getElementById("question");
        const hintEl = document.getElementById("hint");
        qEl.classList.add("flip");
        setTimeout(() => {
          qEl.classList.remove("placeholder");
          if (pick.abstract) {
            qEl.innerHTML = pick.q;
            hintEl.textContent = "全員寫一樣才算成立";
          } else {
            qEl.innerHTML = pick.q.replace("#{n}", `<span class="count">${pick.n}</span>`);
            hintEl.textContent = pick.n === 1
              ? "全員寫一樣才算成立"
              : `寫 ${pick.n} 個 · 至少 1 個全員都寫了的`;
          }
          qEl.classList.remove("flip");
          pendingLevel = session.level;
          document.getElementById("verdict").classList.add("show");
          document.getElementById("drawBtn").style.display = "none";
        }, 280);
      }

      // --- Record (after a question is answered) -----------------------
      function record(achieved) {
        if (pendingLevel == null || busy || session.done) return;
        const lv = pendingLevel;
        pendingLevel = null;
        document.getElementById("verdict").classList.remove("show");

        if (achieved) {
          session.total += 1;
          pulseCount();
        } else {
          session.fails += 1;
        }
        session.round += 1;
        saveSession();
        renderCounter();
        renderStrikes();

        // --- Demotion checks ---
        // L3: any fail demotes immediately
        if (lv === 3 && !achieved) {
          saveSession();
          showDemotion(2);
          return;
        }
        // L2: 2 fails in this attempt demotes
        if (lv === 2 && session.fails >= 2) {
          saveSession();
          showDemotion(1);
          return;
        }

        // --- Round / level completion ---
        if (session.round >= ROUNDS[lv]) {
          // finished all rounds of this level → advance
          if (lv < 3) {
            showTransition(lv + 1);
          } else {
            // L3 + achieved → finale
            showFinale();
          }
          return;
        }

        // continue current level, next round
        renderThreshold();
        document.getElementById("drawBtn").style.display = "";
      }

      function pulseCount() {
        const num = document.getElementById("totalCount");
        num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
        setTimeout(() => num.classList.remove("pop"), 700);
      }

      // --- Transitions --------------------------------------------------
      function showTransition(nextLevel) {
        busy = true;
        document.getElementById("qBlock").classList.add("dim");
        document.getElementById("transitionEyebrow").textContent = "你們進入";
        document.getElementById("transitionRoman").textContent = ROMAN[nextLevel];
        document.getElementById("transitionSub").textContent = PHASE_NAMES[nextLevel];
        const overlay = document.getElementById("transition");
        overlay.classList.remove("demotion");
        overlay.classList.add("show");
        setTimeout(() => {
          overlay.classList.remove("show");
          setTimeout(() => {
            // advance session
            session.level = nextLevel;
            session.round = 0;
            session.fails = 0;
            saveSession();
            renderAll();
            resetQuestionToReady();
            document.getElementById("qBlock").classList.remove("dim");
            busy = false;
          }, 600);
        }, 2400);
      }

      function showDemotion(toLevel) {
        busy = true;
        document.getElementById("qBlock").classList.add("dim");
        const eyebrow = toLevel === 2 ? "緣分散了" : "心未聚";
        const sub = toLevel === 2 ? "退回第二階段 重來" : "退回第一階段 重來";
        document.getElementById("transitionEyebrow").textContent = eyebrow;
        document.getElementById("transitionRoman").textContent = ROMAN[toLevel];
        document.getElementById("transitionSub").textContent = sub;
        const overlay = document.getElementById("transition");
        overlay.classList.add("demotion", "show");
        setTimeout(() => {
          overlay.classList.remove("show");
          setTimeout(() => {
            overlay.classList.remove("demotion");
            session.level = toLevel;
            session.round = 0;
            session.fails = 0;
            saveSession();
            renderAll();
            resetQuestionToReady();
            document.getElementById("qBlock").classList.remove("dim");
            busy = false;
          }, 600);
        }, 2800);
      }

      // --- Finale -------------------------------------------------------
      function showFinale() {
        session.done = true;
        saveSession();
        renderAll();
        document.getElementById("finalCount").textContent = session.total;
        const starsEl = document.getElementById("finalStars");
        starsEl.innerHTML = "";
        const starSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 7.2 7.5.4-5.8 4.8 2 7.3L12 17.7 5.8 21.7l2-7.3L2 9.6l7.5-.4z" /></svg>';
        for (let i = 0; i < session.total; i++) {
          const wrap = document.createElement("span");
          wrap.innerHTML = starSvg;
          const svg = wrap.firstChild;
          svg.style.animationDelay = (i * 0.08) + "s";
          starsEl.appendChild(svg);
        }
        document.getElementById("finale").classList.add("show");
      }

      function restart() {
        session = freshSession();
        saveSession();
        document.getElementById("finale").classList.remove("show");
        renderAll();
        resetQuestionToReady();
      }

      function resetSession() {
        if (!confirm("清空這場的共感紀錄？")) return;
        restart();
      }

      // --- Init ---------------------------------------------------------
      renderAll();
      if (session.done) showFinale();
    </script>
  </body>
</html>
