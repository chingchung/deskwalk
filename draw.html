<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>deskwalk · 抽題 demo</title>
    <style>
      :root {
        --bg: #f5f5f0;
        --surface: #ffffff;
        --ink: #1a1a1a;
        --ink-soft: #5a5a5a;
        --line: #e5e3da;
        --l1: #4a8a5e;
        --l2: #c89a5b;
        --l3: #a04a6e;
      }
      * { box-sizing: border-box; }
      body {
        font-family: "Helvetica Neue", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1.25rem;
      }
      header {
        text-align: center;
        margin-bottom: 2rem;
      }
      header h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }
      header p {
        color: var(--ink-soft);
        margin: 0;
        font-size: 0.95rem;
      }
      .levels {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .level-btn {
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 0.5rem 1.1rem;
        font-size: 0.95rem;
        cursor: pointer;
        color: var(--ink-soft);
        transition: all 0.15s;
        font-family: inherit;
      }
      .level-btn:hover { border-color: var(--ink-soft); }
      .level-btn.active[data-level="1"] { border-color: var(--l1); color: var(--l1); background: #eef5ef; }
      .level-btn.active[data-level="2"] { border-color: var(--l2); color: var(--l2); background: #faf4ea; }
      .level-btn.active[data-level="3"] { border-color: var(--l3); color: var(--l3); background: #f5ecf0; }

      .card {
        width: 100%;
        max-width: 480px;
        min-height: 280px;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        padding: 2rem 1.75rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        margin-bottom: 1.5rem;
        position: relative;
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .card.flip { transform: translateY(8px); opacity: 0.3; }
      .card-badge {
        position: absolute;
        top: 1rem;
        left: 1rem;
        font-size: 0.75rem;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .card[data-level="1"] .card-badge { background: #eef5ef; color: var(--l1); }
      .card[data-level="2"] .card-badge { background: #faf4ea; color: var(--l2); }
      .card[data-level="3"] .card-badge { background: #f5ecf0; color: var(--l3); }

      .question {
        font-size: 1.45rem;
        line-height: 1.55;
        margin: 0;
        color: var(--ink);
        font-weight: 500;
      }
      .count {
        display: inline-block;
        padding: 0 0.15rem;
        font-weight: 700;
        font-size: 1.7rem;
      }
      .card[data-level="1"] .count { color: var(--l1); }
      .card[data-level="2"] .count { color: var(--l2); }
      .card[data-level="3"] .count { color: var(--l3); }
      .card[data-level="3"] .question {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .card[data-level="3"] {
        background: linear-gradient(180deg, #ffffff 0%, #faf4f7 100%);
      }

      .hint {
        color: var(--ink-soft);
        font-size: 0.85rem;
        margin-top: 1.25rem;
      }
      .empty {
        color: var(--ink-soft);
        font-style: italic;
      }
      .draw-btn {
        background: var(--ink);
        color: white;
        border: none;
        padding: 0.85rem 2.5rem;
        font-size: 1.05rem;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.1s;
        letter-spacing: 0.05em;
      }
      .draw-btn:hover { transform: translateY(-1px); }
      .draw-btn:active { transform: translateY(0); }

      .footer-nav {
        margin-top: 2.5rem;
        font-size: 0.85rem;
        color: var(--ink-soft);
      }
      .footer-nav a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
      .footer-nav a:hover { color: var(--ink); }

      .rules {
        max-width: 480px;
        margin-top: 2rem;
        padding: 1.25rem 1.5rem;
        background: rgba(255,255,255,0.5);
        border-left: 3px solid var(--line);
        border-radius: 0 8px 8px 0;
        font-size: 0.9rem;
        color: var(--ink-soft);
        line-height: 1.7;
      }
      .rules strong { color: var(--ink); }

      .counter {
        width: 100%;
        max-width: 480px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .counter-total {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .counter-total .big {
        font-size: 2.25rem;
        font-weight: 700;
        line-height: 1;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .counter-total .label {
        font-size: 0.85rem;
        color: var(--ink-soft);
      }
      .counter-breakdown {
        display: flex;
        gap: 0.4rem;
        font-size: 0.78rem;
      }
      .pill {
        padding: 0.3rem 0.6rem;
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        background: #f4f4ef;
        color: var(--ink-soft);
      }
      .pill[data-level="1"] { background: #eef5ef; color: var(--l1); }
      .pill[data-level="2"] { background: #faf4ea; color: var(--l2); }
      .pill[data-level="3"] { background: #f5ecf0; color: var(--l3); }
      .reset {
        background: none;
        border: none;
        color: var(--ink-soft);
        font-size: 0.78rem;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
        font-family: inherit;
      }
      .reset:hover { color: var(--ink); }

      .verdict {
        display: none;
        gap: 0.6rem;
        margin-bottom: 1.5rem;
      }
      .verdict.show { display: flex; }
      .verdict button {
        padding: 0.7rem 1.4rem;
        font-size: 0.95rem;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        border: 2px solid transparent;
        transition: transform 0.1s;
      }
      .verdict button:hover { transform: translateY(-1px); }
      .verdict .yes {
        background: var(--ink);
        color: white;
      }
      .verdict .no {
        background: transparent;
        border-color: var(--line);
        color: var(--ink-soft);
      }
      .verdict .no:hover { border-color: var(--ink-soft); color: var(--ink); }

      .stars {
        font-size: 1rem;
        color: var(--warm, #c89a5b);
        margin-top: 0.3rem;
        letter-spacing: 0.15em;
      }

      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.25); }
        100% { transform: scale(1); }
      }
      .counter-total .big.pop {
        animation: pop 0.35s ease;
        color: var(--warm, #c89a5b);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>心靈共感</h1>
      <p>所有人合作 · 達成至少一個共同答案才算過關</p>
    </header>

    <div class="counter">
      <div class="counter-total">
        <span class="big" id="totalCount">0</span>
        <span class="label">個共感<br><span class="stars" id="stars"></span></span>
      </div>
      <div class="counter-breakdown">
        <span class="pill" data-level="1">L1 <span id="c1">0</span></span>
        <span class="pill" data-level="2">L2 <span id="c2">0</span></span>
        <span class="pill" data-level="3">L3 <span id="c3">0</span></span>
      </div>
      <button class="reset" onclick="resetSession()">重新開始</button>
    </div>

    <div class="levels">
      <button class="level-btn active" data-level="1" onclick="setLevel(1)">L1 · 暖身（寫 3）</button>
      <button class="level-btn" data-level="2" onclick="setLevel(2)">L2 · 升溫（寫 2）</button>
      <button class="level-btn" data-level="3" onclick="setLevel(3)">L3 · 共感（寫 1）</button>
    </div>

    <div class="card" id="card" data-level="1">
      <span class="card-badge" id="badge">LEVEL 1</span>
      <p class="question empty" id="question">按下抽題開始</p>
      <p class="hint" id="hint"></p>
    </div>

    <div class="verdict" id="verdict">
      <button class="yes" onclick="record(true)">✓ 共感達成</button>
      <button class="no" onclick="record(false)">沒中，下一題</button>
    </div>

    <button class="draw-btn" id="drawBtn" onclick="draw()">抽 題</button>

    <div class="rules">
      <strong>玩法：</strong>全員合作達成「心靈共感」。每一輪同步寫答案，揭曉時——只要 <strong>至少一個答案是全員都寫了的</strong>，就過關。沒有勝負，只有「我們有沒有在同一頻率上」。
      <br><br>
      <strong>三個 Level 是一場儀式：</strong>
      <br>L1 寫 3 個——暖身，靠共同文化的網大撈一筆。
      <br>L2 寫 2 個——升溫，靠想像力的偏好對齊。
      <br>L3 寫 1 個——共感試煉，題目抽象，全員寫一樣才成立。想像所有人最後都畫了一個星星——這是 L3 的目標。
    </div>

    <p class="footer-nav">
      <a href="index.html">← 回到 deskwalk 主頁</a>
    </p>

    <script>
      const BANK = {
        1: [
          { q: "寫出 #{n} 首代表香港的歌", n: 3 },
          { q: "寫出 #{n} 部小時候必看的卡通", n: 3 },
          { q: "寫出 #{n} 樣最有香港味的茶餐廳食物", n: 3 },
          { q: "寫出 #{n} 個一定要帶外國朋友去的香港地點", n: 3 },
          { q: "寫出 #{n} 部最代表香港的電影", n: 3 },
          { q: "寫出 #{n} 個你覺得最香港的食物", n: 3 },
          { q: "寫出 #{n} 個讓你哭過的廣告", n: 3 },
          { q: "寫出 #{n} 個香港人最常用的口頭禪", n: 3 },
          { q: "寫出 #{n} 首婚禮必播的歌", n: 3 },
          { q: "寫出 #{n} 個夜深會去吃的宵夜", n: 3 },
          { q: "寫出 #{n} 個冬天必喝的飲料", n: 3 },
          { q: "寫出 #{n} 個小時候放學會去的地方", n: 3 },
        ],
        2: [
          { q: "寫出 #{n} 個適合做名字的水果", n: 2 },
          { q: "寫出 #{n} 個聽起來很貴但其實便宜的東西", n: 2 },
          { q: "寫出 #{n} 個適合當寵物名字的食物", n: 2 },
          { q: "寫出 #{n} 個最浪漫的家具", n: 2 },
          { q: "寫出 #{n} 個最像天氣的情緒", n: 2 },
          { q: "寫出 #{n} 個最適合做暗號的詞", n: 2 },
          { q: "寫出 #{n} 個最像愛情的飲料", n: 2 },
          { q: "寫出 #{n} 個最不該出現在喪禮的歌", n: 2 },
          { q: "寫出 #{n} 個最像星期一的食物", n: 2 },
          { q: "寫出 #{n} 種你願意當的動物", n: 2 },
          { q: "寫出 #{n} 個最像「孤獨」的物件", n: 2 },
          { q: "寫出 #{n} 個最可能在桌上玩家裡爆紅的人", n: 2 },
          { q: "寫出 #{n} 個最像貓的桌上玩家", n: 2 },
          { q: "寫出 #{n} 個會在半夜傳訊息給你的玩家", n: 2 },
          { q: "寫出 #{n} 個最像深夜便利店的城市", n: 2 },
        ],
        3: [
          { q: "畫一個圖形", n: 1, abstract: true },
          { q: "寫一個顏色", n: 1, abstract: true },
          { q: "寫一個動物", n: 1, abstract: true },
          { q: "寫一個 1 到 10 的數字", n: 1, abstract: true },
          { q: "寫一個字代表今晚", n: 1, abstract: true },
          { q: "寫一個季節", n: 1, abstract: true },
          { q: "想一個聲音", n: 1, abstract: true },
          { q: "畫一個你想送給大家的禮物", n: 1, abstract: true },
          { q: "寫一個讓人想哭的詞", n: 1, abstract: true },
          { q: "寫一個能形容這群人的字", n: 1, abstract: true },
          { q: "畫一個你心裡的「家」", n: 1, abstract: true },
          { q: "寫一個天氣", n: 1, abstract: true },
          { q: "想一個味道", n: 1, abstract: true },
          { q: "寫一個動作", n: 1, abstract: true },
          { q: "畫一個讓世界停下來的瞬間", n: 1, abstract: true },
        ]
      };

      let currentLevel = 1;
      let lastQuestion = null;
      let pendingLevel = null;  // level of currently-shown question, waiting for verdict
      const STORAGE_KEY = 'deskwalk-session';

      function loadSession() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : { 1: 0, 2: 0, 3: 0 };
        } catch { return { 1: 0, 2: 0, 3: 0 }; }
      }
      function saveSession(s) { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
      let session = loadSession();

      function renderCounter() {
        const total = session[1] + session[2] + session[3];
        const totalEl = document.getElementById('totalCount');
        totalEl.textContent = total;
        document.getElementById('c1').textContent = session[1];
        document.getElementById('c2').textContent = session[2];
        document.getElementById('c3').textContent = session[3];
        // star ribbon — one ⭐ per L3 共感, max 10
        const stars = '⭐'.repeat(Math.min(session[3], 10));
        document.getElementById('stars').textContent = stars;
      }
      renderCounter();

      function record(achieved) {
        if (pendingLevel == null) return;
        if (achieved) {
          session[pendingLevel] += 1;
          saveSession(session);
          const big = document.getElementById('totalCount');
          renderCounter();
          big.classList.remove('pop');
          void big.offsetWidth;  // restart animation
          big.classList.add('pop');
          setTimeout(() => big.classList.remove('pop'), 400);
        }
        pendingLevel = null;
        document.getElementById('verdict').classList.remove('show');
        document.getElementById('drawBtn').style.display = '';
      }

      function resetSession() {
        if (!confirm('清空這場的共感紀錄？')) return;
        session = { 1: 0, 2: 0, 3: 0 };
        saveSession(session);
        renderCounter();
      }

      function setLevel(lv) {
        currentLevel = lv;
        document.querySelectorAll('.level-btn').forEach(b => {
          b.classList.toggle('active', Number(b.dataset.level) === lv);
        });
        const card = document.getElementById('card');
        card.dataset.level = lv;
        document.getElementById('badge').textContent = `LEVEL ${lv}`;
      }

      function draw() {
        const bank = BANK[currentLevel];
        let pick;
        do {
          pick = bank[Math.floor(Math.random() * bank.length)];
        } while (bank.length > 1 && pick === lastQuestion);
        lastQuestion = pick;

        const card = document.getElementById('card');
        const qEl = document.getElementById('question');
        const hintEl = document.getElementById('hint');

        card.classList.add('flip');
        setTimeout(() => {
          qEl.classList.remove('empty');
          if (pick.abstract) {
            qEl.innerHTML = pick.q;
            hintEl.textContent = `全員寫一樣才算成立 · 沒有對錯`;
          } else {
            qEl.innerHTML = pick.q.replace('#{n}', `<span class="count">${pick.n}</span>`);
            const goalText = pick.n === 1
              ? `全員寫一樣才算過關`
              : `寫 ${pick.n} 個 · 至少 1 個全員都寫了的`;
            hintEl.textContent = goalText;
          }
          card.classList.remove('flip');
          // show verdict buttons, hide draw button until verdict given
          pendingLevel = currentLevel;
          document.getElementById('verdict').classList.add('show');
          document.getElementById('drawBtn').style.display = 'none';
        }, 200);
      }
    </script>
  </body>
</html>
