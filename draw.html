<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心靈共感 · deskwalk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Dark cosmic bg, cream cards */
        --bg: oklch(0.17 0.014 280);        /* deep night */
        --bg-deep: oklch(0.12 0.016 280);
        --card: oklch(0.94 0.012 80);       /* cream card face */
        --card-edge: oklch(0.86 0.014 80);
        --ink-on-card: oklch(0.22 0.012 60);
        --ink-on-card-soft: oklch(0.5 0.01 60);
        --ink-on-card-faint: oklch(0.68 0.008 60);
        --ink: oklch(0.92 0.012 80);        /* light text on dark bg */
        --ink-soft: oklch(0.7 0.012 280);
        --ink-faint: oklch(0.5 0.014 280);
        --line: oklch(0.32 0.014 280);
        --accent: oklch(0.94 0.012 80);
        --glow: oklch(0.94 0.012 80 / 0.2);
        --warn: oklch(0.62 0.06 25);
        --serif: "Cormorant Garamond", "Songti TC", "Noto Serif TC", serif;
        --sans: "Inter", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        margin: 0;
        font-size: 16px;
        font-weight: 300;
        letter-spacing: 0.01em;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
      }
      /* Cosmic radial — soft warm halo at top, deepening to edges */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 25%,
          oklch(0.24 0.025 290) 0%,
          var(--bg) 55%,
          var(--bg-deep) 100%
        );
        z-index: -1;
        pointer-events: none;
      }
      /* Ambient corner ornaments */
      .ornament {
        position: fixed;
        color: var(--ink);
        opacity: 0.13;
        pointer-events: none;
        z-index: 0;
        transition: opacity 0.6s ease;
      }
      .ornament svg { display: block; width: 100%; height: 100%; }
      .ornament-tr { top: 1.5rem; right: 1.25rem; width: 4.5rem; height: 4.5rem; }
      .ornament-bl { bottom: 4rem; left: 1.25rem; width: 5.5rem; height: 5.5rem; }
      @media (max-width: 480px) {
        .ornament-tr { width: 3rem; height: 3rem; opacity: 0.1; }
        .ornament-bl { width: 3.5rem; height: 3.5rem; opacity: 0.1; }
      }

      /* Small inline glyphs */
      .glyph-inline {
        display: inline-block;
        vertical-align: middle;
        color: var(--ink-faint);
      }
      .bubble-mark {
        margin: 1.2rem auto 0;
        opacity: 0.45;
        color: var(--ink-soft);
      }
      .bubble-mark svg { width: 26px; height: 14px; }

      /* Star specks scattered on dark sky */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 17% 23%, oklch(0.95 0.02 80 / 0.55) 50%, transparent 100%),
          radial-gradient(1px 1px at 64% 12%, oklch(0.9 0.05 320 / 0.4) 50%, transparent 100%),
          radial-gradient(1.5px 1.5px at 84% 71%, oklch(0.95 0.02 80 / 0.5) 50%, transparent 100%),
          radial-gradient(1px 1px at 23% 84%, oklch(0.9 0.05 320 / 0.35) 50%, transparent 100%),
          radial-gradient(1px 1px at 47% 56%, oklch(0.95 0.02 80 / 0.3) 50%, transparent 100%),
          radial-gradient(1.5px 1.5px at 91% 33%, oklch(0.95 0.02 80 / 0.45) 50%, transparent 100%),
          radial-gradient(1px 1px at 8% 64%, oklch(0.95 0.02 80 / 0.4) 50%, transparent 100%),
          radial-gradient(1px 1px at 38% 8%, oklch(0.95 0.02 80 / 0.35) 50%, transparent 100%),
          radial-gradient(1px 1px at 72% 88%, oklch(0.95 0.02 80 / 0.4) 50%, transparent 100%);
        z-index: -1;
        pointer-events: none;
      }

      .stage {
        max-width: 560px;
        margin: 0 auto;
        padding: 3rem 1.75rem 6rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        min-height: 100vh;
      }

      /* HEADER — counter + progress */
      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 4rem;
        gap: 2rem;
      }
      .counter {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
      }
      .counter .num {
        font-family: var(--serif);
        font-size: 2.75rem;
        font-weight: 400;
        line-height: 1;
        color: var(--ink);
        font-variant-numeric: lining-nums tabular-nums;
        transition: color 0.6s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .counter .num.pop {
        color: var(--accent);
        transform: scale(1.08);
      }
      .counter .num.drop {
        color: var(--warn);
        transform: translateY(2px) scale(0.96);
      }
      .counter .num-label {
        font-size: 0.74rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-faint);
        font-weight: 400;
      }
      .progress {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.7rem;
      }
      .journey {
        display: flex;
        gap: 0.85rem;
        align-items: center;
      }
      .leg {
        display: flex;
        gap: 0.45rem;
      }
      .leg + .leg::before {
        content: "";
        align-self: center;
        width: 0.55rem;
        height: 1px;
        background: var(--line);
        margin-right: 0.3rem;
        margin-left: -0.3rem;
      }
      .dot {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        background: transparent;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      /* L3 dots are slightly larger — the climax leg */
      .leg[data-level="3"] .dot {
        width: 0.78rem;
        height: 0.78rem;
      }
      .dot.win {
        background: var(--ink);
        border-color: var(--ink);
      }
      .dot.current {
        border-color: var(--ink);
        animation: dotPulse 1.8s ease-in-out infinite;
      }
      @keyframes dotPulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--glow); transform: scale(1); }
        50%      { box-shadow: 0 0 0 5px transparent; transform: scale(1.18); }
      }
      .threshold {
        font-size: 0.78rem;
        color: var(--ink-faint);
        font-style: italic;
        font-family: var(--serif);
        text-align: right;
      }

      /* QUESTION — speech bubble */
      .question-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1.5rem;
        padding: 1rem 0 2rem;
        transition: opacity 0.4s ease;
      }
      .question-block.dim { opacity: 0.25; }
      .eyebrow {
        font-size: 0.74rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0;
      }
      /* DECK — stacked cards with the active one on top */
      .deck {
        position: relative;
        width: min(22rem, 86vw);
        aspect-ratio: 5 / 7;
        margin: 0 auto;
      }
      .card {
        position: absolute;
        inset: 0;
        background: var(--card);
        border-radius: 22px;
        box-shadow: 0 14px 30px -10px oklch(0 0 0 / 0.5),
                    0 2px 0 0 oklch(0 0 0 / 0.15) inset;
      }
      /* Static stack cards behind active — suggest a deck */
      .card.stack-2 {
        transform: translate(10px, 8px) rotate(2.4deg);
        background: var(--card-edge);
        opacity: 0.78;
        z-index: 1;
      }
      .card.stack-1 {
        transform: translate(5px, 4px) rotate(-1deg);
        background: var(--card);
        opacity: 0.92;
        z-index: 2;
      }
      .card.active {
        transform: rotate(-2deg);
        z-index: 3;
        display: flex;
        flex-direction: column;
        padding: 1.4rem 1.6rem 1.8rem;
        transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                    opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }
      /* Flying off the deck */
      .card.active.exit {
        transform: translateY(-220px) rotate(-12deg) scale(1.02);
        opacity: 0;
        transition-duration: 0.5s;
      }
      /* Sliding back from the stack */
      .card.active.enter {
        transform: translateY(38px) rotate(-5deg) scale(0.96);
        opacity: 0;
        transition-duration: 0s;
      }

      .card-symbol {
        flex: 1;
        display: grid;
        place-items: center;
        color: var(--ink-on-card);
        min-height: 0;
      }
      .card-symbol svg {
        width: 70%;
        max-width: 12rem;
        height: auto;
        max-height: 100%;
      }
      .card-divider {
        width: 1.5rem;
        height: 1px;
        background: var(--ink-on-card-faint);
        margin: 0.4rem auto 0.8rem;
        opacity: 0.55;
      }
      .question {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(1.05rem, 3.4vw, 1.3rem);
        line-height: 1.55;
        color: var(--ink-on-card);
        margin: 0;
        text-align: center;
        max-width: 22ch;
        margin-left: auto;
        margin-right: auto;
      }
      .question .count {
        font-weight: 600;
        color: var(--ink-on-card);
        padding: 0 0.1em;
        font-size: 1.2em;
      }
      .hint {
        font-family: var(--serif);
        font-size: 0.85rem;
        color: var(--ink-soft);
        margin: 1.2rem 0 0;
        letter-spacing: 0.04em;
        text-align: center;
      }
      .placeholder {
        font-family: var(--serif);
        color: var(--ink-on-card-faint);
      }

      /* ACTIONS */
      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        margin-top: 2rem;
      }
      .verdict {
        display: none;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .verdict.show { display: flex; }
      .btn {
        font-family: var(--sans);
        font-size: 0.95rem;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0.95rem 2rem;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: inherit;
      }
      .btn-primary {
        background: var(--ink);
        color: var(--bg);
        border: 1.5px solid var(--ink);
      }
      .btn-primary:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .btn-ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1.5px solid var(--line);
      }
      .btn-ghost:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      /* OVERLAYS */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg);
        display: grid;
        place-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .overlay.show { opacity: 1; pointer-events: auto; }
      .overlay-inner {
        text-align: center;
        max-width: 28rem;
        padding: 2rem;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                    transform 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
      }
      .overlay.show .overlay-inner { opacity: 1; transform: translateY(0); }
      .overlay-eyebrow {
        font-size: 0.74rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0 0 1.5rem;
      }
      .overlay-title {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 2.5rem;
        line-height: 1.2;
        margin: 0 0 0.5rem;
        color: var(--ink);
      }
      .overlay-title .roman {
        font-weight: 600;
        color: var(--ink);
      }
      .overlay-sub {
        font-family: var(--serif);
        font-size: 1rem;
        color: var(--ink-soft);
        margin: 0;
        letter-spacing: 0.04em;
      }
      .overlay-glyph {
        margin: 0 auto 1.5rem;
        width: 4rem;
        height: 4rem;
        color: var(--ink);
        opacity: 0.75;
      }
      .finale-mandala {
        width: 5rem;
        height: 5rem;
        animation: mandalaSpin 60s linear infinite;
      }
      @keyframes mandalaSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* FINALE */
      .finale-count {
        font-family: var(--serif);
        font-size: 5rem;
        font-weight: 400;
        color: var(--ink);
        margin: 1.25rem 0 0.5rem;
        line-height: 1;
      }
      .finale-caption {
        font-family: var(--serif);
        font-size: 1rem;
        color: var(--ink-soft);
        margin: 0 0 2rem;
        letter-spacing: 0.04em;
      }
      .finale-stars {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
        margin: 1rem 0 2.5rem;
        max-width: 22rem;
      }
      .finale-stars svg {
        width: 1.4rem;
        height: 1.4rem;
        color: var(--ink);
        opacity: 0;
        animation: starFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes starFadeIn {
        from { opacity: 0; transform: scale(0.6) rotate(-12deg); }
        to   { opacity: 0.85; transform: scale(1) rotate(0); }
      }

      /* FOOTER */
      .footer-info {
        position: fixed;
        bottom: 1.25rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-faint);
        pointer-events: none;
      }
      .footer-info a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
        border-bottom: 1px solid transparent;
        padding-bottom: 1px;
        transition: border-color 0.2s;
      }
      .footer-info a:hover { border-color: var(--ink-soft); color: var(--ink-soft); }
      .reset {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        pointer-events: auto;
        margin-left: 1.5rem;
      }
      .reset:hover { color: var(--ink-soft); }

      /* L3 (climax) — slightly heavier emphasis, no color shift */
      .stage[data-level="3"] .question {
        font-size: clamp(1.5rem, 4.5vw, 1.85rem);
      }
    </style>
  </head>
  <body>

    <!-- Ambient cosmic ornaments -->
    <div class="ornament ornament-tr" aria-hidden="true">
      <!-- Concentric ripples — energy field -->
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="32" r="4" fill="currentColor" stroke="none" />
        <path d="M20 32 Q20 22 32 22 Q44 22 44 32" />
        <path d="M14 36 Q14 18 32 18 Q50 18 50 36" />
        <path d="M8 40 Q8 14 32 14 Q56 14 56 40" />
      </svg>
    </div>

    <div class="ornament ornament-bl" aria-hidden="true">
      <!-- Pair of lopsided stars with faces — twin spirits -->
      <svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- top star -->
        <path d="M54 6 L58 24 L74 24 L60 32 L64 50 L52 38 L40 44 L46 30 L36 20 L50 20 Z" />
        <circle cx="56" cy="26" r="0.8" fill="currentColor" stroke="none" />
        <circle cx="51" cy="28" r="0.8" fill="currentColor" stroke="none" />
        <path d="M51 32 Q54 34 57 32" />
        <!-- bottom star -->
        <path d="M22 36 L26 50 L40 50 L28 58 L32 74 L20 64 L8 72 L14 58 L4 50 L18 50 Z" />
        <circle cx="22" cy="54" r="0.8" fill="currentColor" stroke="none" />
        <circle cx="18" cy="56" r="0.8" fill="currentColor" stroke="none" />
        <path d="M18 60 Q21 62 24 60" />
      </svg>
    </div>

    <div class="stage" id="stage" data-level="1">

      <header class="head">
        <div class="counter">
          <span class="num" id="totalCount">0</span>
          <span class="num-label">
            <svg class="glyph-inline" width="9" height="9" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0 L9.5 5.5 L15 7 L9.5 8.5 L8 14 L6.5 8.5 L1 7 L6.5 5.5 Z" />
            </svg>
            共感
          </span>
        </div>
        <div class="progress">
          <div class="journey" id="journey">
            <div class="leg" data-level="1">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <div class="leg" data-level="2">
              <span class="dot"></span><span class="dot"></span>
            </div>
            <div class="leg" data-level="3">
              <span class="dot"></span>
            </div>
          </div>
          <span class="threshold" id="thresholdText">第一階段 · 第 1 / 3 題</span>
        </div>
      </header>

      <div class="question-block" id="qBlock">
        <p class="eyebrow" id="phaseLabel">第一階段 · 暖身</p>
        <div class="deck">
          <div class="card stack-2" aria-hidden="true"></div>
          <div class="card stack-1" aria-hidden="true"></div>
          <div class="card active" id="bubble">
            <div class="card-symbol" id="cardSymbol" aria-hidden="true"></div>
            <div class="card-divider" aria-hidden="true"></div>
            <p class="question placeholder" id="question">準備好了嗎</p>
          </div>
        </div>
        <p class="hint" id="hint">按下方開始</p>
      </div>

      <div class="actions">
        <div class="verdict" id="verdict">
          <button class="btn btn-primary" onclick="record(true)">共感</button>
          <button class="btn btn-ghost" onclick="record(false)">未中</button>
        </div>
        <button class="btn btn-primary" id="drawBtn" onclick="draw()">開始儀式</button>
      </div>

    </div>

    <!-- Transition overlay between levels -->
    <div class="overlay" id="transition">
      <div class="overlay-inner">
        <!-- Glyph swapped per destination level by JS -->
        <div id="transitionGlyph">
          <svg class="overlay-glyph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M32 6 L36 28 L58 32 L36 36 L32 58 L28 36 L6 32 L28 28 Z" />
          </svg>
        </div>
        <p class="overlay-eyebrow" id="transitionEyebrow">你們進入</p>
        <p class="overlay-title">第<span class="roman" id="transitionRoman">二</span>階段</p>
        <p class="overlay-sub" id="transitionSub">升溫</p>
      </div>
    </div>

    <!-- Glyph library (hidden — JS clones into transition overlay) -->
    <div id="glyphLibrary" hidden>
      <!-- Level 2 — energy ripples (升溫 = warming, energy waves) -->
      <template id="glyph-l2">
        <svg class="overlay-glyph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="32" cy="36" r="3" fill="currentColor" stroke="none" />
          <path d="M18 36 Q18 26 32 26 Q46 26 46 36" />
          <path d="M12 38 Q12 20 32 20 Q52 20 52 38" />
          <path d="M6 40 Q6 14 32 14 Q58 14 58 40" />
        </svg>
      </template>
      <!-- Level 3 — hands holding orb (共感 = the held moment) -->
      <template id="glyph-l3">
        <svg class="overlay-glyph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="32" cy="22" r="5" fill="currentColor" stroke="none" />
          <path d="M16 60 Q12 44 16 32 Q20 18 30 16" />
          <path d="M20 60 Q18 46 22 34 Q26 22 30 20" />
          <path d="M48 60 Q52 44 48 32 Q44 18 34 16" />
          <path d="M44 60 Q46 46 42 34 Q38 22 34 20" />
        </svg>
      </template>
    </div>

    <!-- Finale overlay -->
    <div class="overlay" id="finale">
      <div class="overlay-inner">
        <svg class="overlay-glyph finale-mandala" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- Outer rays -->
          <g opacity="0.5">
            <line x1="40" y1="4" x2="40" y2="14" />
            <line x1="40" y1="66" x2="40" y2="76" />
            <line x1="4" y1="40" x2="14" y2="40" />
            <line x1="66" y1="40" x2="76" y2="40" />
            <line x1="14" y1="14" x2="20" y2="20" />
            <line x1="60" y1="60" x2="66" y2="66" />
            <line x1="66" y1="14" x2="60" y2="20" />
            <line x1="14" y1="66" x2="20" y2="60" />
          </g>
          <!-- Concentric rings -->
          <circle cx="40" cy="40" r="28" opacity="0.35" />
          <circle cx="40" cy="40" r="20" opacity="0.6" />
          <circle cx="40" cy="40" r="12" opacity="0.85" />
          <!-- Core star -->
          <path d="M40 30 L42 38 L50 40 L42 42 L40 50 L38 42 L30 40 L38 38 Z" fill="currentColor" stroke="none" />
        </svg>
        <p class="overlay-eyebrow">這場儀式完成</p>
        <p class="finale-count" id="finalCount">0</p>
        <p class="finale-caption">個共感被你們共同寫下</p>

          { q: "想一個流星劃過時你會許的願", n: 1, abstract: true },
          { q: "畫一個此刻的心情", n: 1, abstract: true },
          { q: "想一個能代表這群人的圖騰", n: 1, abstract: true },
          { q: "寫一個你覺得永恆的東西", n: 1, abstract: true },
          { q: "寫一個第一次見到海時的感覺", n: 1, abstract: true },
          { q: "畫一道光", n: 1, abstract: true },
          { q: "想一個能代替「再見」的詞", n: 1, abstract: true },
          { q: "寫一個你願意守一輩子的秘密的形狀", n: 1, abstract: true },
          { q: "畫一條河", n: 1, abstract: true },
          { q: "寫一個此刻最想對自己說的字", n: 1, abstract: true },
        ]
      };

      const THRESHOLDS = { 1: 3, 2: 2, 3: 1 };  // 每階段需要的淨共感數（難度遞增、次數遞減）

      // --- Procedural symbol generator (Matisse cutout style) ---------
      function rng(seed) {
        let s = (seed | 0) || 1;
        return () => {
          s = Math.imul(s ^ s >>> 15, s | 1);
          s ^= s + Math.imul(s ^ s >>> 7, s | 61);
          return ((s ^ s >>> 14) >>> 0) / 4294967296;
        };
      }
      function blobPath(cx, cy, r, complexity, irregularity, rand) {
        const pts = [];
        for (let i = 0; i < complexity; i++) {
          const angle = (i / complexity) * Math.PI * 2 + (rand() - 0.5) * 0.3;
          const radius = r * (1 - irregularity + rand() * irregularity * 2);
          pts.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius });
        }
        // Catmull-Rom -> cubic bezier, closed
        const n = pts.length;
        let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} `;
        for (let i = 0; i < n; i++) {
          const p0 = pts[(i - 1 + n) % n];
          const p1 = pts[i];
          const p2 = pts[(i + 1) % n];
          const p3 = pts[(i + 2) % n];
          const c1x = p1.x + (p2.x - p0.x) / 6;
          const c1y = p1.y + (p2.y - p0.y) / 6;
          const c2x = p2.x - (p3.x - p1.x) / 6;
          const c2y = p2.y - (p3.y - p1.y) / 6;
          d += `C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)} `;
        }
        return d + "Z";
      }
      function generateSymbolSVG() {
        const seed = (Math.random() * 1e9) | 0;
        const r = rng(seed);
        const VB = 100;
        const cx = VB / 2, cy = VB / 2;
        const paths = [];
        const type = Math.floor(r() * 5);

        if (type === 0) {
          // Single irregular bloom
          const baseR = 28 + r() * 8;
          paths.push(blobPath(cx, cy, baseR, 7 + Math.floor(r() * 5), 0.25 + r() * 0.3, r));
        } else if (type === 1) {
          // Burst — high irregularity, more lobes
          paths.push(blobPath(cx, cy, 26 + r() * 6, 10 + Math.floor(r() * 4), 0.55 + r() * 0.3, r));
        } else if (type === 2) {
          // Pair — two overlapping forms
          const dx = 8 + r() * 6, dy = 6 + r() * 5;
          paths.push(blobPath(cx - dx, cy - dy, 18 + r() * 4, 8, 0.3 + r() * 0.2, r));
          paths.push(blobPath(cx + dx, cy + dy, 14 + r() * 4, 7, 0.35 + r() * 0.2, r));
        } else if (type === 3) {
          // Cluster of small bodies orbiting
          const count = 3 + Math.floor(r() * 3);
          const orbit = 18 + r() * 6;
          for (let i = 0; i < count; i++) {
            const ang = (i / count) * Math.PI * 2 + r() * 0.4;
            const cxx = cx + Math.cos(ang) * orbit;
            const cyy = cy + Math.sin(ang) * orbit;
            paths.push(blobPath(cxx, cyy, 7 + r() * 5, 6 + Math.floor(r() * 3), 0.25 + r() * 0.25, r));
          }
        } else {
          // Big body + small companion
          paths.push(blobPath(cx - 6, cy + 2, 24 + r() * 5, 8, 0.3 + r() * 0.2, r));
          paths.push(blobPath(cx + 18, cy - 16, 6 + r() * 4, 7, 0.4, r));
        }

        const inner = paths.map(d => `<path d="${d}" fill="currentColor" />`).join("");
        return `<svg viewBox="0 0 ${VB} ${VB}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
      }
      const ROMAN = { 1: "一", 2: "二", 3: "三" };
      const PHASE_NAMES = { 1: "暖身", 2: "升溫", 3: "共感" };
      const STORAGE_KEY = "deskwalk-session-v7";

      function freshSession() {
        return {
          level: 1,
          net: { 1: 0, 2: 0, 3: 0 },  // net 共感 per level (wins - fails, floored)
          used: { 1: [], 2: [], 3: [] }, // indices of questions already drawn this session
          done: false,
          started: false
        };
      }
      function totalNet() {
        return session.net[1] + session.net[2] + session.net[3];
      }
      function loadSession() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEY);
          return raw ? { ...freshSession(), ...JSON.parse(raw) } : freshSession();
        } catch { return freshSession(); }
      }
      function saveSession() { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(session)); }

      let session = loadSession();
      let lastQuestion = null;
      let pendingLevel = null;  // level of currently-shown question (waiting for verdict)
      let busy = false;         // suppress interactions during transitions

      // --- Render -------------------------------------------------------
      function renderCounter() {
        document.getElementById("totalCount").textContent = totalNet();
      }
      function renderDots() {
        [1, 2, 3].forEach(lv => {
          const leg = document.querySelector(`.leg[data-level="${lv}"]`);
          const dots = leg.querySelectorAll(".dot");
          const filled = session.net[lv];
          dots.forEach((d, i) => {
            d.classList.remove("win", "current");
            if (i < filled) {
              d.classList.add("win");
            } else if (lv === session.level && i === filled && !session.done) {
              d.classList.add("current");
            }
          });
        });
      }
      function renderThreshold() {
        const tEl = document.getElementById("thresholdText");
        if (session.done) { tEl.textContent = "儀式完成"; return; }
        const lv = session.level;
        const need = THRESHOLDS[lv] - session.net[lv];
        const nextPhase = lv < 3 ? `第${ROMAN[lv + 1]}階段` : "儀式終局";
        if (need <= 0) {
          tEl.textContent = "即將進入下一階段";
        } else if (lv === 3) {
          tEl.textContent = `再 ${need} 個共感 完成儀式`;
        } else {
          tEl.textContent = `再 ${need} 個共感 進入${nextPhase}`;
        }
      }
      function renderPhaseLabel() {
        document.getElementById("phaseLabel").textContent =
          `第${ROMAN[session.level]}階段 · ${PHASE_NAMES[session.level]}`;
      }
      function renderAll() {
        renderCounter(); renderDots(); renderThreshold(); renderPhaseLabel();
        document.getElementById("stage").dataset.level = session.level;
      }

      // --- Draw ---------------------------------------------------------
      function showReadyState() {
        const qEl = document.getElementById("question");
        const bubble = document.getElementById("bubble");
        const symEl = document.getElementById("cardSymbol");
        qEl.classList.add("placeholder");
        qEl.textContent = "準備好了嗎";
        document.getElementById("hint").textContent = "全員圍坐，按下方開始";
        symEl.innerHTML = "";
        bubble.classList.remove("exit", "enter");
        document.getElementById("verdict").classList.remove("show");
        document.getElementById("drawBtn").style.display = "";
        pendingLevel = null;
      }

      function draw() {
        if (busy || session.done) return;
        session.started = true;

        const bank = BANK[session.level];
        const used = session.used[session.level];
        let pool = [];
        for (let i = 0; i < bank.length; i++) {
          if (!used.includes(i)) pool.push(i);
        }
        if (pool.length === 0) {
          session.used[session.level] = [];
          for (let i = 0; i < bank.length; i++) pool.push(i);
        }
        const idx = pool[Math.floor(Math.random() * pool.length)];
        session.used[session.level].push(idx);
        const pick = bank[idx];
        lastQuestion = pick;
        saveSession();

        const qEl = document.getElementById("question");
        const bubble = document.getElementById("bubble");
        const hintEl = document.getElementById("hint");
        const symEl = document.getElementById("cardSymbol");
        document.getElementById("drawBtn").style.display = "none";
        document.getElementById("verdict").classList.remove("show");

        const isFirstDraw = qEl.classList.contains("placeholder");

        const renderContent = () => {
          qEl.classList.remove("placeholder");
          if (pick.abstract) {
            qEl.innerHTML = pick.q;
            hintEl.textContent = "全員寫一樣才算成立";
          } else {
            qEl.innerHTML = pick.q.replace("#{n}", `<span class="count">${pick.n}</span>`);
            hintEl.textContent = pick.n === 1
              ? "全員寫一樣才算成立"
              : `寫 ${pick.n} 個 · 至少 1 個全員都寫了的`;
          }
          symEl.innerHTML = generateSymbolSVG();
        };

        if (isFirstDraw) {
          // First card slides up from the deck
          bubble.classList.add("enter");
          renderContent();
          requestAnimationFrame(() => {
            bubble.classList.remove("enter");
            setTimeout(() => {
              pendingLevel = session.level;
              document.getElementById("verdict").classList.add("show");
            }, 480);
          });
        } else {
          // Top card flies off, next card slides up from deck
          bubble.classList.add("exit");
          setTimeout(() => {
            renderContent();
            bubble.classList.remove("exit");
            bubble.classList.add("enter");
            requestAnimationFrame(() => {
              bubble.classList.remove("enter");
              setTimeout(() => {
                pendingLevel = session.level;
                document.getElementById("verdict").classList.add("show");
              }, 480);
            });
          }, 420);
        }
      }

      // --- Record (after a question is answered) -----------------------
      function record(achieved) {
        if (pendingLevel == null || busy || session.done) return;
        const lv = pendingLevel;
        pendingLevel = null;
        document.getElementById("verdict").classList.remove("show");

        if (achieved) {
          session.net[lv] = Math.min(THRESHOLDS[lv], session.net[lv] + 1);
          pulseCount("win");
        } else {
          if (session.net[lv] > 0) {
            session.net[lv] -= 1;
            pulseCount("loss");
          }
          // if already at 0, fail is absorbed silently
        }
        saveSession();
        renderCounter();
        renderDots();
        renderThreshold();

        // Threshold check: advance to next level or finale
        if (session.net[lv] >= THRESHOLDS[lv]) {
          if (lv < 3) {
            showTransition(lv + 1);
          } else {
            showFinale();
          }
          return;
        }

        // Auto-flow: next question after a brief beat for feedback
        setTimeout(() => { if (!busy && !session.done) draw(); }, 750);
      }

      function pulseCount(kind) {
        const num = document.getElementById("totalCount");
        num.classList.remove("pop", "drop");
        void num.offsetWidth;
        num.classList.add(kind === "loss" ? "drop" : "pop");
        setTimeout(() => num.classList.remove("pop", "drop"), 700);
      }

      // --- Transitions --------------------------------------------------
      function showTransition(nextLevel) {
        busy = true;
        document.getElementById("qBlock").classList.add("dim");
        document.getElementById("transitionEyebrow").textContent = "你們進入";
        document.getElementById("transitionRoman").textContent = ROMAN[nextLevel];
        document.getElementById("transitionSub").textContent = PHASE_NAMES[nextLevel];
        // Swap glyph by destination level
        const glyphHost = document.getElementById("transitionGlyph");
        const tpl = document.getElementById("glyph-l" + nextLevel);
        if (tpl) {
          glyphHost.innerHTML = "";
          glyphHost.appendChild(tpl.content.cloneNode(true));
        }
        const overlay = document.getElementById("transition");
        overlay.classList.add("show");
        setTimeout(() => {
          overlay.classList.remove("show");
          setTimeout(() => {
            session.level = nextLevel;
            saveSession();
            renderAll();
            document.getElementById("qBlock").classList.remove("dim");
            busy = false;
            // auto-draw first question of new level
            draw();
          }, 600);
        }, 2400);
      }

      // --- Finale -------------------------------------------------------
      function showFinale() {
        session.done = true;
        saveSession();
        renderAll();
        const t = totalNet();
        document.getElementById("finalCount").textContent = t;
        const starsEl = document.getElementById("finalStars");
        starsEl.innerHTML = "";
        const starSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 7.2 7.5.4-5.8 4.8 2 7.3L12 17.7 5.8 21.7l2-7.3L2 9.6l7.5-.4z" /></svg>';
        for (let i = 0; i < t; i++) {
          const wrap = document.createElement("span");
          wrap.innerHTML = starSvg;
          const svg = wrap.firstChild;
          svg.style.animationDelay = (i * 0.08) + "s";
          starsEl.appendChild(svg);
        }
        document.getElementById("finale").classList.add("show");
      }

      function restart() {
        session = freshSession();
        saveSession();
        document.getElementById("finale").classList.remove("show");
        renderAll();
        showReadyState();
      }

      function resetSession() {
        if (!confirm("清空這場的共感紀錄？")) return;
        restart();
      }

      // --- Init ---------------------------------------------------------
      renderAll();
      if (session.done) {
        showFinale();
      } else if (!session.started) {
        showReadyState();
      } else {
        // Mid-session: auto-resume by drawing a new question
        draw();
      }
    </script>
