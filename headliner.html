<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Headliner · 頭條人物 · deskwalk</title>
<link rel="stylesheet" href="brand.css" />
<link rel="stylesheet" href="proto-mono.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  /* paper grid + ink come from brand.css */
  body:has(#camera-screen.active) .dw-mark { display: none; }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Card screen (light) ---------- */
  #card-screen { padding: max(52px, calc(env(safe-area-inset-top, 0px) + 40px)) 24px max(24px, env(safe-area-inset-bottom, 0px)); }
  #top-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 0; gap: 12px; }
  #thumb-strip { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  #thumb-strip::-webkit-scrollbar { display: none; }
  .thumb { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); }
  .top-btn { background: var(--card); color: var(--ink-soft); border: 1px solid var(--line); padding: 7px 13px; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .top-btn:active { transform: translateY(1px); }
  #top-actions { display: flex; gap: 8px; flex-shrink: 0; }
  #version-tag { text-align: center; padding: 14px 0 0; color: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  #question-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
  #question { font-size: 32px; font-weight: 800; line-height: 1.4; text-align: center; word-break: break-word; color: var(--ink); max-width: 18ch; }
  #card-buttons { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px; font-size: 19px; font-weight: 900; border: none; border-radius: 14px; cursor: pointer; font-family: inherit; transition: transform .06s, box-shadow .06s; }
  .btn-primary { background: linear-gradient(180deg, #4A443B, var(--accent)); color: #fff; -webkit-backdrop-filter: var(--glass-blur-sm); backdrop-filter: var(--glass-blur-sm); box-shadow: var(--shadow-pop); }
  .btn-primary:active { transform: translateY(3px); box-shadow: var(--shadow-press); }
  .btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); -webkit-backdrop-filter: var(--glass-blur-sm); backdrop-filter: var(--glass-blur-sm); box-shadow: var(--shadow); }
  .btn-secondary:active { transform: translateY(2px); }
  /* glass surfaces */
  .top-btn, .photo-item { -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }

  /* ---------- Camera screen (stays dark — live capture) ---------- */
  #camera-screen { position: fixed; inset: 0; background: #000; z-index: 100; }
  #video-wrap { flex: 1; position: relative; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #video.mirror { transform: scaleX(-1); }
  #overlay-text { position: absolute; bottom: 20px; left: 24px; right: 24px; color: #fff; font-size: 44px; font-weight: 900; line-height: 1.12; text-align: left; text-shadow: 0 2px 6px rgba(0,0,0,0.35); word-break: break-word; }
  #camera-controls { padding: 20px 24px calc(env(safe-area-inset-bottom, 0) + 20px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; background: #000; }
  #shutter { width: 78px; height: 78px; border-radius: 50%; background: #fff; border: 4px solid #888; cursor: pointer; justify-self: center; }
  #shutter:active { background: #ddd; }
  .small-btn { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.28); -webkit-backdrop-filter: var(--glass-blur-sm); backdrop-filter: var(--glass-blur-sm); padding: 12px 16px; border-radius: 12px; font-size: 15px; font-family: inherit; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25); }
  #cancel-btn { justify-self: start; }
  #flip-btn { justify-self: end; }

  /* ---------- Results screen (light) ---------- */
  #results-screen { padding: max(52px, calc(env(safe-area-inset-top, 0px) + 40px)) 24px max(24px, env(safe-area-inset-bottom, 0px)); }
  #results-header { padding: 8px 0 16px; text-align: center; }
  #results-header h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: var(--ink); }
  #results-header p { color: var(--ink-soft); font-size: 14px; }
  #photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 8px 0 24px; }
  .photo-item { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .photo-item img { width: 100%; display: block; }
  .photo-item .save-one { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.66); color: #fff; border: none; padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; }
  #results-buttons { display: flex; flex-direction: column; gap: 12px; padding: 8px 0 24px; }
  #empty-note { text-align: center; color: var(--ink-soft); padding: 40px 0; font-size: 14px; }

  #error { color: #8A8175; padding: 12px; font-size: 14px; text-align: center; }
  #live-overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #canvas { display: none; }
</style>
</head>
<body>
<a class="dw-mark" href="index.html">deskwalk</a>

<!-- Card screen -->
<div class="screen active" id="card-screen">
  <div id="top-bar">
    <div id="thumb-strip"></div>
    <div id="top-actions">
      <button class="top-btn" id="skip-btn">跳過</button>
      <button class="top-btn" id="end-btn">結束</button>
    </div>
  </div>
  <div id="version-tag">Headliner · 頭條人物 · v1.1 · 2026-05-28</div>
  <div id="question-wrap">
    <div id="question">準備好了嗎?</div>
  </div>
  <div id="card-buttons">
    <button class="btn btn-primary" id="capture-btn">拍照認證</button>
    <button class="btn btn-secondary" id="next-btn">下一題</button>
  </div>
</div>

<!-- Camera screen -->
<div class="screen" id="camera-screen">
  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="live-overlay"></canvas>
    <div id="overlay-text"></div>
  </div>
  <div id="error"></div>
  <div id="camera-controls">
    <button class="small-btn" id="cancel-btn">取消</button>
    <button id="shutter" aria-label="拍照"></button>
    <button class="small-btn" id="flip-btn">切換鏡頭</button>
  </div>
</div>

<!-- Results screen -->
<div class="screen" id="results-screen">
  <div id="results-header">
    <h1>這局完成</h1>
    <p>長按相片可儲存,或用下方按鈕分享 / 儲存到相簿</p>
  </div>
  <div id="photo-grid"></div>
  <div id="empty-note" style="display:none;">這局沒有拍照</div>
  <div id="results-buttons">
    <button class="btn btn-primary" id="save-all-btn">儲存所有相片到相簿</button>
    <button class="btn btn-secondary" id="restart-btn">再玩一局</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
const QUESTIONS = [
  "最有可能在公司廁所睡覺的人",
  "最有可能在電影院喊的人",
  "最有可能買咗 gym 會員但只去過 3 次的人",
  "最有可能對住手機 cam 自言自語的人",
  "最有可能喺 IG story 影食嘢的人",
  "最有可能將件外套擺喺櫈背唔記得攞走的人",
  "最有可能喺 K 房點咗首歌但唔肯唱的人",
  "最有可能開會扮做筆記其實喺度畫畫的人",
  "最有可能買書多過睇書的人",
  "最有可能講完「我瞓喇」之後仲掃兩個鐘手機的人",
  "最有可能將同一首歌 loop 一個禮拜的人",
  "最有可能企喺便利店食晒先走的人",
  "最有可能分手之後即刻換 profile pic 的人",
  "最有可能扮睇唔到前度 IG 但日日 stalk 的人",
  "最有可能同前度仲做好朋友的人",
  "最有可能對住塊鏡練習講嘢的人",
  "最有可能凌晨三點傳 message 的人",
  "最有可能分手後 block 完又 unblock 的人",
  "最有可能 send WhatsApp voice message 過一分鐘的人",
  "最有可能自拍超過 50 張先肯放上 IG 的人",
  "最有可能喺自助餐食到要鬆皮帶的人",
  "最有可能去日本第一件事衝藥房的人",
  "最有可能屋企養嘅植物全部死晒的人",
  "最有可能將 IG 密友設定畀 80 個人的人",
  "最有可能搭港鐵搭過龍的人"
];

let pool = [];
let currentQuestion = "";
let stream = null;
let facingMode = "user";
let sessionPhotos = []; // { dataUrl, blob, name }
let faceDetector = null;
let detectorLoading = false;
let detectLoopId = null;
let lastDetections = [];

const $ = (id) => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function reshuffle() {
  pool = QUESTIONS.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
}

function setQuestion() {
  if (pool.length === 0) reshuffle();
  currentQuestion = pool.pop();
  $("question").textContent = currentQuestion;
}

function addThumb(dataUrl) {
  const img = document.createElement("img");
  img.className = "thumb";
  img.src = dataUrl;
  $("thumb-strip").appendChild(img);
  $("thumb-strip").scrollLeft = $("thumb-strip").scrollWidth;
}

async function startCamera() {
  stopCamera();
  $("error").textContent = "";
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode } },
      audio: false
    });
    const video = $("video");
    video.srcObject = stream;
    video.classList.toggle("mirror", facingMode === "user");
  } catch (e) {
    $("error").textContent = "無法開啟相機: " + (e.message || e.name);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

function openCamera() {
  $("overlay-text").textContent = currentQuestion;
  showScreen("camera-screen");
  startCamera().then(() => {
    ensureDetector().then(() => startDetectLoop());
  });
}

function closeCamera() {
  stopDetectLoop();
  stopCamera();
  showScreen("card-screen");
}

async function ensureDetector() {
  if (faceDetector || detectorLoading) return faceDetector;
  detectorLoading = true;
  try {
    const mod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const vision = await mod.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceDetector = await mod.FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      minDetectionConfidence: 0.5
    });
  } catch (e) {
    console.warn("Face detector failed to load, falling back to bottom text", e);
    faceDetector = null;
  }
  detectorLoading = false;
  return faceDetector;
}

function startDetectLoop() {
  if (!faceDetector) return;
  const video = $("video");
  const canvas = $("live-overlay");
  const ctx = canvas.getContext("2d");

  function tick() {
    if (!stream) { detectLoopId = null; return; }
    if (video.readyState >= 2 && video.videoWidth) {
      if (canvas.width !== video.videoWidth) canvas.width = video.videoWidth;
      if (canvas.height !== video.videoHeight) canvas.height = video.videoHeight;
      try {
        const result = faceDetector.detectForVideo(video, performance.now());
        lastDetections = result && result.detections ? result.detections : [];
      } catch (e) {
        lastDetections = [];
      }
      const mirror = facingMode === "user";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCensorBars(ctx, canvas.width, canvas.height, lastDetections, currentQuestion, mirror);
      $("overlay-text").style.display = lastDetections.length ? "none" : "block";
    }
    detectLoopId = requestAnimationFrame(tick);
  }
  detectLoopId = requestAnimationFrame(tick);
}

function stopDetectLoop() {
  if (detectLoopId) cancelAnimationFrame(detectLoopId);
  detectLoopId = null;
  lastDetections = [];
  const canvas = $("live-overlay");
  if (canvas.width) canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  $("overlay-text").style.display = "block";
}

function drawCensorBars(ctx, w, h, detections, text, mirror) {
  for (const det of detections) {
    const kp = det.keypoints;
    if (!kp || kp.length < 2) continue;
    let x1 = kp[0].x * w, y1 = kp[0].y * h;
    let x2 = kp[1].x * w, y2 = kp[1].y * h;
    if (mirror) { x1 = w - x1; x2 = w - x2; }
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const eyeDist = Math.hypot(dx, dy);
    if (eyeDist < 10) continue;
    // Normalize so text never renders upside-down regardless of which keypoint
    // came first or whether the image is mirrored.
    let angle = Math.atan2(dy, dx);
    if (angle > Math.PI / 2) angle -= Math.PI;
    else if (angle < -Math.PI / 2) angle += Math.PI;
    // Clamp width so the bar stays inside the frame (axis-aligned approximation)
    const maxBarW = Math.max(40, Math.min(cx, w - cx) * 2 * 0.95);
    const barW = Math.min(eyeDist * 4.2, maxBarW);
    const barH = eyeDist * 1.1;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.fillStyle = "#000";
    ctx.fillRect(-barW / 2, -barH / 2, barW, barH);

    // Shrink-to-fit text
    let fontSize = barH * 0.6;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let displayText = text;
    const maxW = barW * 0.92;
    while (fontSize > 8) {
      ctx.font = `900 ${fontSize}px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif`;
      if (ctx.measureText(displayText).width <= maxW) break;
      fontSize -= 1;
    }
    if (ctx.measureText(displayText).width > maxW) {
      // truncate
      while (displayText.length > 4 && ctx.measureText(displayText + "…").width > maxW) {
        displayText = displayText.slice(0, -1);
      }
      displayText += "…";
    }
    ctx.fillText(displayText, 0, 0);
    ctx.restore();
  }
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function dataUrlToBlob(dataUrl) {
  const [head, b64] = dataUrl.split(",");
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function capture() {
  const video = $("video");
  if (!video.videoWidth) return;

  const canvas = $("canvas");
  const w = video.videoWidth;
  const h = video.videoHeight;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");

  if (facingMode === "user") {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, w, h);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // Re-detect on the captured frame for accuracy (sync with live)
  let detections = lastDetections;
  if (faceDetector) {
    try {
      const result = faceDetector.detectForVideo(video, performance.now());
      if (result && result.detections) detections = result.detections;
    } catch (e) { /* keep lastDetections */ }
  }

  if (detections && detections.length > 0) {
    drawCensorBars(ctx, w, h, detections, currentQuestion, facingMode === "user");
  } else {
    // Fallback: bottom-left text
    const fontSize = Math.round(w * 0.115);
    ctx.font = `900 ${fontSize}px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif`;
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";
    const padding = Math.round(w * 0.055);
    const maxTextWidth = w - padding * 2;
    const lines = wrapText(ctx, currentQuestion, maxTextWidth);
    const lineHeight = Math.round(fontSize * 1.12);
    const baseY = h - padding;
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = Math.round(fontSize * 0.12);
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = Math.round(fontSize * 0.05);
    ctx.fillStyle = "#fff";
    lines.forEach((ln, i) => {
      const y = baseY - (lines.length - 1 - i) * lineHeight;
      ctx.fillText(ln, padding, y);
    });
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
  const blob = dataUrlToBlob(dataUrl);
  const name = `headliner-${Date.now()}.jpg`;
  sessionPhotos.push({ dataUrl, blob, name });
  addThumb(dataUrl);

  closeCamera();
  setQuestion();
}

function renderPhotoGrid() {
  const grid = $("photo-grid");
  grid.innerHTML = "";
  if (sessionPhotos.length === 0) {
    $("empty-note").style.display = "block";
    $("save-all-btn").style.display = "none";
    return;
  }
  $("empty-note").style.display = "none";
  $("save-all-btn").style.display = "block";

  sessionPhotos.forEach((p, idx) => {
    const wrap = document.createElement("div");
    wrap.className = "photo-item";

    const img = document.createElement("img");
    img.src = p.dataUrl;
    img.alt = `照片 ${idx + 1}`;
    wrap.appendChild(img);

    const btn = document.createElement("button");
    btn.className = "save-one";
    btn.textContent = "儲存";
    btn.addEventListener("click", () => savePhoto(p));
    wrap.appendChild(btn);

    grid.appendChild(wrap);
  });
}

async function savePhoto(photo) {
  const file = new File([photo.blob], photo.name, { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  // Fallback: open in new tab so user can long-press → Save to Photos
  const url = URL.createObjectURL(photo.blob);
  window.open(url, "_blank");
}

async function saveAll() {
  const files = sessionPhotos.map(p => new File([p.blob], p.name, { type: "image/jpeg" }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  // Fallback: save one by one
  for (const p of sessionPhotos) {
    await savePhoto(p);
  }
}

function showResults() {
  renderPhotoGrid();
  showScreen("results-screen");
}

function restart() {
  sessionPhotos = [];
  $("thumb-strip").innerHTML = "";
  setQuestion();
  showScreen("card-screen");
}

$("next-btn").addEventListener("click", setQuestion);
$("capture-btn").addEventListener("click", openCamera);
$("cancel-btn").addEventListener("click", closeCamera);
$("shutter").addEventListener("click", capture);
$("flip-btn").addEventListener("click", () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
});
$("skip-btn").addEventListener("click", () => setQuestion());
$("end-btn").addEventListener("click", showResults);
$("save-all-btn").addEventListener("click", saveAll);
$("restart-btn").addEventListener("click", restart);

// Init
reshuffle();
setQuestion();
</script>
</body>
</html>
