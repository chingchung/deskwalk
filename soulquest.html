<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>最勁係你</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Card screen ---------- */
  #card-screen { padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0); }
  #top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; gap: 12px; }
  #round-indicator { color: #888; font-size: 14px; letter-spacing: 0.1em; }
  .top-btn { background: transparent; color: #888; border: 1px solid #333; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; }
  #top-actions { display: flex; gap: 8px; }
  #version-tag { text-align: center; padding: 4px 0 0; color: #555; font-size: 11px; letter-spacing: 0.05em; }
  #question-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
  #question { font-size: 36px; font-weight: 700; line-height: 1.4; text-align: center; word-break: break-word; }
  #card-buttons { display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
  .btn { width: 100%; padding: 20px; font-size: 20px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .btn-primary { background: #fff; color: #000; }
  .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }

  /* ---------- Camera screen ---------- */
  #camera-screen { position: fixed; inset: 0; background: #000; }
  #video-wrap { flex: 1; position: relative; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #video.mirror { transform: scaleX(-1); }
  #overlay-text { position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 20px 24px; background: rgba(0,0,0,0.55); color: #fff; font-size: 22px; font-weight: 700; line-height: 1.4; text-align: center; }
  #camera-controls { padding: 20px 24px calc(env(safe-area-inset-bottom, 0) + 20px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; background: #000; }
  #shutter { width: 78px; height: 78px; border-radius: 50%; background: #fff; border: 4px solid #888; cursor: pointer; justify-self: center; }
  #shutter:active { background: #ddd; }
  .small-btn { background: transparent; color: #fff; border: 1px solid #555; padding: 12px 16px; border-radius: 10px; font-size: 15px; font-family: inherit; cursor: pointer; }
  #cancel-btn { justify-self: start; }
  #flip-btn { justify-self: end; }

  /* ---------- Results screen ---------- */
  #results-screen { padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0); }
  #results-header { padding: 32px 0 16px; text-align: center; }
  #results-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  #results-header p { color: #888; font-size: 14px; }
  #photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 8px 0 24px; }
  .photo-item { position: relative; background: #111; border-radius: 8px; overflow: hidden; }
  .photo-item img { width: 100%; display: block; }
  .photo-item .save-one { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: inherit; cursor: pointer; }
  #results-buttons { display: flex; flex-direction: column; gap: 12px; padding: 8px 0 24px; }
  #empty-note { text-align: center; color: #666; padding: 40px 0; font-size: 14px; }

  #error { color: #ff8080; padding: 12px; font-size: 14px; text-align: center; }
  canvas { display: none; }
</style>
</head>
<body>

<!-- Card screen -->
<div class="screen active" id="card-screen">
  <div id="top-bar">
    <div id="round-indicator">第 <span id="round-num">1</span> / 4 題</div>
    <div id="top-actions">
      <button class="top-btn" id="skip-btn">跳過</button>
      <button class="top-btn" id="end-btn">結束</button>
    </div>
  </div>
  <div id="version-tag">最勁係你 · v0.5 · 2026-05-27</div>
  <div id="question-wrap">
    <div id="question">準備好了嗎?</div>
  </div>
  <div id="card-buttons">
    <button class="btn btn-primary" id="capture-btn">拍照認證</button>
    <button class="btn btn-secondary" id="next-btn">下一題</button>
  </div>
</div>

<!-- Camera screen -->
<div class="screen" id="camera-screen">
  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay-text"></div>
  </div>
  <div id="error"></div>
  <div id="camera-controls">
    <button class="small-btn" id="cancel-btn">取消</button>
    <button id="shutter" aria-label="拍照"></button>
    <button class="small-btn" id="flip-btn">切換鏡頭</button>
  </div>
</div>

<!-- Results screen -->
<div class="screen" id="results-screen">
  <div id="results-header">
    <h1>這局完成</h1>
    <p>長按相片可儲存,或用下方按鈕分享 / 儲存到相簿</p>
  </div>
  <div id="photo-grid"></div>
  <div id="empty-note" style="display:none;">這局沒有拍照</div>
  <div id="results-buttons">
    <button class="btn btn-primary" id="save-all-btn">儲存所有相片到相簿</button>
    <button class="btn btn-secondary" id="restart-btn">再玩一局</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
const QUESTIONS = [
  "最有可能在公司廁所睡覺的人",
  "最有可能在電影院喊的人",
  "最有可能買咗 gym 會員但只去過 3 次的人",
  "最有可能對住手機 cam 自言自語的人",
  "最有可能喺 IG story 影食嘢的人",
  "最有可能將件外套擺喺櫈背唔記得攞走的人",
  "最有可能喺 K 房點咗首歌但唔肯唱的人",
  "最有可能開會扮做筆記其實喺度畫畫的人",
  "最有可能買書多過睇書的人",
  "最有可能講完「我瞓喇」之後仲掃兩個鐘手機的人",
  "最有可能將同一首歌 loop 一個禮拜的人",
  "最有可能企喺便利店食晒先走的人",
  "最有可能分手之後即刻換 profile pic 的人",
  "最有可能扮睇唔到前度 IG 但日日 stalk 的人",
  "最有可能同前度仲做好朋友的人",
  "最有可能對住塊鏡練習講嘢的人",
  "最有可能凌晨三點傳 message 的人",
  "最有可能為咗段關係改變自己的人",
  "最有可能講「我冇事」但成個人都喺度話有事的人",
  "最有可能分手後 block 完又 unblock 的人",
  "最有可能對陌生人好過對屋企人的人",
  "邊個會 send WhatsApp voice message 過一分鐘",
  "邊個會喺地鐵大聲 FaceTime 講私事",
  "邊個將對 AirPods 留咗喺的士",
  "自拍要影超過 50 張先肯放上 IG 的人",
  "邊個會喺自助餐食到要鬆皮帶",
  "收到「喺咪」會直接已讀不回的人",
  "邊個會跟住 IG 排隊但根本唔知排咩",
  "去日本第一件事衝藥房的人",
  "邊個會喺超市試食試到飽",
  "出街成日唔記得帶八達通的人",
  "收到 8 號風球開心過放假的人",
  "喺𨋢入面對住鏡頭整 fit 的人",
  "屋企養嘅植物全部死晒的人",
  "喺街影 OOTD 影到阻住人的人",
  "將 IG 摯友設定畀 80 個人的人",
  "最有可能搭港鐵搭過龍的人",
  "最似茶記阿姐熟客的人",
  "最有可能執到 $20 都會出 IG story 的人",
  "返屋企第一件事除晒衫淨返底褲的人"
];

const ROUNDS_PER_GAME = 4;

let pool = [];
let currentQuestion = "";
let stream = null;
let facingMode = "user";
let roundNum = 1;
let sessionPhotos = []; // { dataUrl, blob, name }

const $ = (id) => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function reshuffle() {
  pool = QUESTIONS.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
}

function setQuestion() {
  if (pool.length === 0) reshuffle();
  currentQuestion = pool.pop();
  $("question").textContent = currentQuestion;
  $("round-num").textContent = roundNum;
}

function advanceRound() {
  if (roundNum >= ROUNDS_PER_GAME) {
    showResults();
  } else {
    roundNum++;
    setQuestion();
  }
}

async function startCamera() {
  stopCamera();
  $("error").textContent = "";
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode } },
      audio: false
    });
    const video = $("video");
    video.srcObject = stream;
    video.classList.toggle("mirror", facingMode === "user");
  } catch (e) {
    $("error").textContent = "無法開啟相機: " + (e.message || e.name);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

function openCamera() {
  $("overlay-text").textContent = currentQuestion;
  showScreen("camera-screen");
  startCamera();
}

function closeCamera() {
  stopCamera();
  showScreen("card-screen");
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function dataUrlToBlob(dataUrl) {
  const [head, b64] = dataUrl.split(",");
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function capture() {
  const video = $("video");
  if (!video.videoWidth) return;

  const canvas = $("canvas");
  const w = video.videoWidth;
  const h = video.videoHeight;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");

  if (facingMode === "user") {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, w, h);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const fontSize = Math.round(w * 0.055);
  ctx.font = `bold ${fontSize}px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif`;
  ctx.textBaseline = "top";
  const padding = Math.round(w * 0.04);
  const maxTextWidth = w - padding * 2;
  const lines = wrapText(ctx, currentQuestion, maxTextWidth);
  const lineHeight = Math.round(fontSize * 1.35);
  const boxH = padding * 2 + lines.length * lineHeight;

  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, w, boxH);

  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  lines.forEach((ln, i) => {
    ctx.fillText(ln, w / 2, padding + i * lineHeight);
  });

  const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
  const blob = dataUrlToBlob(dataUrl);
  const name = `soulquest-${Date.now()}.jpg`;
  sessionPhotos.push({ dataUrl, blob, name });

  closeCamera();
  advanceRound();
}

function renderPhotoGrid() {
  const grid = $("photo-grid");
  grid.innerHTML = "";
  if (sessionPhotos.length === 0) {
    $("empty-note").style.display = "block";
    $("save-all-btn").style.display = "none";
    return;
  }
  $("empty-note").style.display = "none";
  $("save-all-btn").style.display = "block";

  sessionPhotos.forEach((p, idx) => {
    const wrap = document.createElement("div");
    wrap.className = "photo-item";

    const img = document.createElement("img");
    img.src = p.dataUrl;
    img.alt = `照片 ${idx + 1}`;
    wrap.appendChild(img);

    const btn = document.createElement("button");
    btn.className = "save-one";
    btn.textContent = "儲存";
    btn.addEventListener("click", () => savePhoto(p));
    wrap.appendChild(btn);

    grid.appendChild(wrap);
  });
}

async function savePhoto(photo) {
  const file = new File([photo.blob], photo.name, { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  // Fallback: open in new tab so user can long-press → Save to Photos
  const url = URL.createObjectURL(photo.blob);
  window.open(url, "_blank");
}

async function saveAll() {
  const files = sessionPhotos.map(p => new File([p.blob], p.name, { type: "image/jpeg" }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  // Fallback: save one by one
  for (const p of sessionPhotos) {
    await savePhoto(p);
  }
}

function showResults() {
  renderPhotoGrid();
  showScreen("results-screen");
}

function restart() {
  roundNum = 1;
  sessionPhotos = [];
  setQuestion();
  showScreen("card-screen");
}

$("next-btn").addEventListener("click", advanceRound);
$("capture-btn").addEventListener("click", openCamera);
$("cancel-btn").addEventListener("click", closeCamera);
$("shutter").addEventListener("click", capture);
$("flip-btn").addEventListener("click", () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
});
$("skip-btn").addEventListener("click", () => setQuestion());
$("end-btn").addEventListener("click", showResults);
$("save-all-btn").addEventListener("click", saveAll);
$("restart-btn").addEventListener("click", restart);

// Init
reshuffle();
setQuestion();
</script>
</body>
</html>
