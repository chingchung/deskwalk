<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>疊注賭盤 · 冷知識</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="proto-mono.css" />
    <style>
      :root {
        --card-edge: #F1ECE0;
        --ink-on-card: #1F1B14;
        --ink-on-card-faint: #A8A091;
        --ink-faint: #A49B8C;
        --serif: var(--sans);
      }
      html, body { height: 100%; }
      body {
        color: var(--ink);
        font-size: 16px;
        letter-spacing: 0.01em;
        overflow-x: hidden;
        min-height: 100vh;
      }

      .stage {
        max-width: 640px;
        margin: 0 auto;
        padding: 3.25rem 1.75rem 7rem;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── 卡組 ──────────────────────────────── */
      .question-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding-bottom: 1.5rem;
      }
      .deck {
        /* 橫向卡：跟視窗闊度縮，高度上限保證唔使捲 */
        --deck-max-h: min(46vh, 22rem);
        position: relative;
        width: min(32rem, 90vw, calc(var(--deck-max-h) * 7 / 5));
        height: auto;
        max-height: var(--deck-max-h);
        aspect-ratio: 7 / 5;
        margin: 0 auto;
        perspective: 1400px;
      }
      .card {
        position: absolute;
        inset: 0;
        background: var(--card);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.45s ease;
      }
      /* 牌堆位置：0 = 面頂，1、2 疊喺下面等上場 */
      .card[data-pos="0"] {
        --dx: 0px;
        --dy: 0px;
        --tilt: 0deg;
        z-index: 3;
        /* 面頂張卡嘅「面」由 flipper 兩塊 face 負責，卡殼透明 */
        background: transparent;
        border-color: transparent;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        transform:
          translate3d(var(--dx), var(--dy), 0)
          rotate(calc(-1.4deg + var(--tilt)));
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .card[data-pos="1"] {
        transform: translate(4px, 5px) rotate(0.8deg) scale(0.985);
        opacity: 0.94;
        z-index: 2;
      }
      .card[data-pos="2"] {
        transform: translate(9px, 10px) rotate(-1.8deg) scale(0.97);
        background: var(--card-edge);
        opacity: 0.8;
        z-index: 1;
      }
      /* 抽走那張：沿掃出方向飛離牌堆，transform 由 JS 設定 */
      .card.gone {
        opacity: 0;
        z-index: 4;
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.26s ease 0.22s;
      }
      .card.dragging { transition: none; cursor: grabbing; }
      .card.no-anim { transition: none; }
      .card[data-pos="0"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      /* 翻卡：正面題目，背面答案 */
      .flipper {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .flipper.flipped { transform: rotateY(180deg); }
      .face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.7rem;
        padding: 1.5rem 2rem;
        text-align: center;
        background: var(--card);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        border: 1px solid var(--line);
        border-radius: 22px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .face.back { transform: rotateY(180deg); }

      .cat {
        font-size: 0.68rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-on-card-faint);
        margin: 0;
      }
      .question {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(1.1rem, 3.6vw, 1.38rem);
        line-height: 1.6;
        color: var(--ink-on-card);
        margin: 0;
        text-wrap: balance;
      }
      .question.placeholder { color: var(--ink-on-card-faint); }
      .num {
        font-family: var(--serif);
        font-size: clamp(2.1rem, 7vw, 2.9rem);
        font-weight: 600;
        color: var(--accent);
        letter-spacing: -0.02em;
        line-height: 1.15;
        font-variant-numeric: lining-nums tabular-nums;
        margin: 0;
      }
      .num small {
        font-size: 1rem;
        font-weight: 500;
        color: var(--ink-on-card);
        margin-left: 0.25rem;
      }
      .note {
        font-family: var(--serif);
        font-size: 0.8rem;
        color: var(--ink-on-card-faint);
        margin: 0;
        max-width: 30ch;
        line-height: 1.55;
      }

      /* ── 動作 ──────────────────────────────── */
      .actions {
        display: flex;
        justify-content: center;
      }
      .btn {
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        padding: 0.9rem 1.9rem;
        border-radius: var(--radius-sm);
        cursor: pointer;
        background: linear-gradient(180deg, #4A443B, var(--accent));
        color: #fff;
        border: none;
        box-shadow: var(--shadow-pop);
        transition: transform 0.06s, box-shadow 0.06s;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: var(--shadow-press);
      }

      /* ── 頁腳 ──────────────────────────────── */
      .footer-info {
        position: fixed;
        bottom: 1.25rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-faint);
        pointer-events: none;
      }
      .reset {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
        pointer-events: auto;
        padding: 0;
      }
      .reset:hover { color: var(--ink-soft); }

      /* ── 手機：卡片 + 按鈕一屏內 ────────────── */
      @media (max-width: 540px) {
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { min-height: 100dvh; }

        .stage {
          max-width: none;
          width: 100%;
          height: 100dvh;
          max-height: 100dvh;
          min-height: 0;
          padding:
            max(3rem, calc(env(safe-area-inset-top) + 2.6rem))
            max(1rem, env(safe-area-inset-right))
            calc(2.75rem + env(safe-area-inset-bottom))
            max(1rem, env(safe-area-inset-left));
          display: grid;
          grid-template-rows: minmax(0, 1fr) auto;
          gap: 0.5rem;
          overflow: hidden;
        }

        .question-block {
          flex: none;
          min-height: 0;
          padding-bottom: 0;
          overflow: hidden;
        }

        .deck {
          --deck-max-h: min(46dvh, 17rem, calc(100dvh - 11rem));
          width: min(92vw, 26rem, calc(var(--deck-max-h) * 7 / 5));
          height: auto;
          max-height: var(--deck-max-h);
        }

        .face { padding: 1rem 1.2rem; gap: 0.55rem; }

        .question {
          font-size: clamp(1rem, 4.4vw, 1.22rem);
          line-height: 1.5;
        }
        .num { font-size: clamp(1.8rem, 8vw, 2.3rem); }
        .note { font-size: 0.74rem; max-width: 100%; }

        .btn {
          font-size: 0.82rem;
          padding: 0.72rem 1.5rem;
          letter-spacing: 0.1em;
          min-height: 2.75rem;
        }

        .footer-info {
          bottom: max(0.5rem, env(safe-area-inset-bottom));
          font-size: 0.62rem;
          letter-spacing: 0.14em;
          gap: 1rem;
        }
      }

      @media (max-width: 540px) and (max-height: 680px) {
        .stage { padding-top: max(2.6rem, calc(env(safe-area-inset-top) + 2.3rem)); gap: 0.3rem; }
        .deck {
          --deck-max-h: min(40dvh, 14rem, calc(100dvh - 9.5rem));
          width: min(88vw, 22rem, calc(var(--deck-max-h) * 7 / 5));
        }
        .face { padding: 0.8rem 1rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .card, .flipper { transition-duration: 0.01ms; }
      }
    </style>
  </head>
  <body>
    <a class="dw-mark" href="index.html">deskwalk</a>

    <main class="stage">
      <div class="question-block">
        <div class="deck" id="deck">
          <div class="card" data-pos="0" role="button" tabindex="0" aria-label="翻卡睇答案"></div>
          <div class="card" data-pos="1" aria-hidden="true"></div>
          <div class="card" data-pos="2" aria-hidden="true"></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="nextBtn" type="button">下一題</button>
      </div>
    </main>

    <footer class="footer-info">
      <span id="deckCount"></span>
      <button class="reset" id="shuffleBtn" type="button">重新洗牌</button>
    </footer>

    <script>
      // ── 題庫 ──────────────────────────────────────────────
      // 以「估得出範圍、釘唔死」嘅紀錄/極端題為主，夾幾條低數字陷阱題調節奏。
      // 想改題：直接編呢個 array。u 係數字後面嘅單位。
      const BANK = [
        // 人體
        { c: "人體", q: "成年人全身有幾多塊骨？", a: "206", u: "塊", note: "陷阱題：太多人知，下注空間細。" },
        { c: "人體", q: "BB 出生時全身約有幾多塊骨？", a: "≈300", u: "塊", note: "長大後部分融合，先變成 206 塊。" },
        { c: "人體", q: "人腦大約有幾多億個神經元？", a: "≈860", u: "億", note: "同銀河系恆星數量同一個量級。" },
        { c: "人體", q: "成年人身體大約有幾多 % 係水？", a: "≈60", u: "%", note: "BB 更高，約 75%。" },
        { c: "人體", q: "成年人一日心臟大約跳幾多下？", a: "≈100,000", u: "下", note: "一年約 3,600 萬下。" },
        { c: "人體", q: "打乞嗤噴出嘅氣流時速最高可達約幾多？", a: "≈160", u: "km/h", note: "有研究話可達 100 mph。" },
        { c: "人體", q: "指甲一個月大約長幾多？", a: "≈3.5", u: "mm", note: "手指甲快過腳趾甲。" },

        // 動物
        { c: "動物", q: "獵豹最高時速約幾多？", a: "≈115", u: "km/h", note: "但只能維持幾十秒。" },
        { c: "動物", q: "蜂鳥心跳每分鐘最高約幾多下？", a: "≈1,200", u: "下", note: "人類靜止先約 70 下。" },
        { c: "動物", q: "藍鯨個心臟約重幾多？", a: "≈180", u: "kg", note: "細路仔可以爬得入條主動脈。" },
        { c: "動物", q: "藍鯨條脷約重幾多？", a: "≈2,700", u: "kg", note: "差唔多等於一隻成年大象。" },
        { c: "動物", q: "長頸鹿條頸有幾多塊頸椎？", a: "7", u: "塊", note: "陷阱題：同人類一樣得 7 塊，只係每塊超長。" },
        { c: "動物", q: "樹熊一日大約瞓幾多個鐘？", a: "≈20", u: "個鐘", note: "食尤加利葉好難消化，慳返力氣。" },
        { c: "動物", q: "大象懷孕大約幾多個月？", a: "≈22", u: "個月", note: "哺乳類之中最長之一。" },
        { c: "動物", q: "蟑螂俾人斬咗頭大約仲捱到幾多日？", a: "≈7", u: "日", note: "唔係即死，最後係渴死/餓死。" },
        { c: "動物", q: "鴕鳥一隻蛋約重幾多？", a: "≈1.4", u: "kg", note: "現存最大嘅鳥蛋。" },
        { c: "動物", q: "蝸牛（齒舌）大約有幾多隻「牙」？", a: "≈14,000", u: "隻", note: "部分品種超過 20,000。" },

        // 紀錄
        { c: "紀錄", q: "史上最高嘅人 Robert Wadlow 最終身高幾多？", a: "272", u: "cm", note: "美國人，22 歲離世時仍在長高。" },
        { c: "紀錄", q: "史上最矮成年男性約幾多？", a: "≈54.6", u: "cm", note: "尼泊爾 Chandra Bahadur Dangi。" },
        { c: "紀錄", q: "Joey Chestnut 10 分鐘食最多熱狗紀錄約幾多條？", a: "76", u: "條", note: "2021 年紀錄，或已被刷新。" },
        { c: "紀錄", q: "史上最長頭髮約幾多米？", a: "≈5.6", u: "米", note: "中國謝秋萍，量度時已留咗幾十年。" },
        { c: "紀錄", q: "有人連續打嗝最長維持咗幾多年？", a: "68", u: "年", note: "Charles Osborne，1922–1990。" },
        { c: "紀錄", q: "有紀錄唔瞓覺最長約幾多個鐘？", a: "≈264", u: "個鐘", note: "即約 11 日（Randy Gardner）。" },
        { c: "紀錄", q: "世界最辣辣椒 Pepper X 約幾多萬 SHU？", a: "≈269", u: "萬 SHU", note: "普通指天椒得約 5 萬。" },
        { c: "紀錄", q: "最長壽嘅貓活到幾多歲？", a: "38", u: "歲", note: "美國嘅 Creme Puff。" },
        { c: "紀錄", q: "世界最重南瓜約幾多？", a: "≈1,200", u: "kg", note: "紀錄逐年刷新，已超過 1,200 kg。" },

        // 自然 / 地理
        { c: "自然", q: "珠穆朗瑪峰高約幾多米？", a: "8,849", u: "米", note: "2020 中尼聯合公布新高度。" },
        { c: "自然", q: "馬里亞納海溝最深約幾多米？", a: "≈10,935", u: "米", note: "深過珠峰嘅高度。" },
        { c: "自然", q: "閃電通道瞬間溫度可達約幾多？", a: "≈30,000", u: "°C", note: "約係太陽表面溫度嘅 5 倍。" },
        { c: "自然", q: "地球赤道周長約幾多？", a: "≈40,075", u: "km", note: "所以一秒等於光走 7.5 個圈。" },
        { c: "自然", q: "世界最高瀑布安赫爾瀑布落差約幾多米？", a: "≈979", u: "米", note: "位於委內瑞拉。" },
        { c: "自然", q: "世界最長河（尼羅河）約幾多 km？", a: "≈6,650", u: "km", note: "亞馬遜河同佢爭第一。" },

        // 雜項
        { c: "雜項", q: "埃菲爾鐵塔連天線高約幾多米？", a: "≈330", u: "米", note: "天氣熱膨脹時仲會高多 15 cm。" },
        { c: "雜項", q: "自由神像連底座高約幾多米？", a: "≈93", u: "米", note: "神像本身得約 46 米。" },
        { c: "雜項", q: "鋼琴有幾多個琴鍵？", a: "88", u: "個", note: "陷阱題：52 白 + 36 黑。" },
        { c: "雜項", q: "麥當勞全球大約有幾多間分店？", a: "≈40,000", u: "間", note: "遍佈超過 100 個國家。" },
        { c: "雜項", q: "一年大約有幾多秒？", a: "≈3,153", u: "萬秒", note: "31,536,000 秒（平年）。" },
      ];

      // --- Deck ---------------------------------------------------------
      const deckEl  = document.getElementById("deck");
      const countEl = document.getElementById("deckCount");

      let pool = [];       // 未抽的題目，抽完自動重洗
      let drawn = 0;       // 這副牌已抽的題數
      let order = [...deckEl.querySelectorAll(".card")];  // order[0] = 面頂那張
      let onDeck = null;   // 已經寫喺 order[1] 度、下一張會上場的題目
      let busy = false;

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function refill() {
        pool = shuffle(BANK.slice());
        drawn = 0;
      }
      function renderCount() {
        countEl.textContent = `${drawn} / ${BANK.length}`;
      }

      // 正面題目，背面答案；tap 翻轉
      function faceHTML(pick) {
        return `<div class="flipper">
              <div class="face front">
                <p class="cat">${pick.c}</p>
                <p class="question">${pick.q}</p>
              </div>
              <div class="face back" aria-hidden="true">
                <p class="num">${pick.a}${pick.u ? ` <small>${pick.u}</small>` : ""}</p>
                ${pick.note ? `<p class="note">${pick.note}</p>` : ""}
              </div>
            </div>`;
      }

      function applyRoles() {
        order.forEach((c, i) => {
          c.dataset.pos = i;
          if (i === 0) {
            c.setAttribute("role", "button");
            c.setAttribute("tabindex", "0");
            c.setAttribute("aria-label", "翻卡睇答案");
            c.removeAttribute("aria-hidden");
          } else {
            c.removeAttribute("role");
            c.removeAttribute("tabindex");
            c.removeAttribute("aria-label");
            c.setAttribute("aria-hidden", "true");
          }
        });
      }

      // 下一題預先寫喺牌堆第二張度（答案喺背面），掃開面頂張即刻見到。
      function preload() {
        if (!pool.length) refill();
        onDeck = pool.pop();
        order[1].innerHTML = faceHTML(onDeck);
      }

      function flip() {
        if (busy) return;
        const flipper = order[0].querySelector(".flipper");
        if (!flipper) return;
        const flipped = flipper.classList.toggle("flipped");
        const back = flipper.querySelector(".face.back");
        if (back) back.setAttribute("aria-hidden", String(!flipped));
        order[0].setAttribute("aria-label", flipped ? "返回題目" : "翻卡睇答案");
      }

      // 抽下一題：面頂那張飛走，下面牌堆嗰張（已經寫好題目）升上嚟。
      // ux / uy = 飛走方向（掃出嘅向量），預設向上。
      function next(ux = 0, uy = -1) {
        if (busy) return;
        if (!onDeck) preload();
        drawn++;
        busy = true;

        const outgoing = order[0];

        const len = Math.hypot(ux, uy) || 1;
        const dist = Math.max(deckEl.offsetWidth, deckEl.offsetHeight) * 1.5;
        outgoing.classList.remove("dragging");
        outgoing.classList.add("gone");
        outgoing.style.transform =
          `translate3d(${(ux / len * dist).toFixed(0)}px, ${(uy / len * dist).toFixed(0)}px, 0)` +
          ` rotate(${(ux / len * 16 - 4).toFixed(1)}deg) scale(1.02)`;

        order = [order[1], order[2], order[0]];
        applyRoles();
        renderCount();

        // 面頂換咗之後，即刻再排定下一題喺第二張牌
        onDeck = null;
        preload();

        const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 480;
        setTimeout(() => {
          // 飛走那張洗返落牌堆底
          outgoing.classList.add("no-anim");
          outgoing.classList.remove("gone");
          outgoing.style.transform = "";
          ["--dx", "--dy", "--tilt"].forEach(v => outgoing.style.removeProperty(v));
          outgoing.innerHTML = "";
          void outgoing.offsetWidth;
          outgoing.classList.remove("no-anim");
          busy = false;
        }, wait);
      }

      // --- 點一下翻卡 / 掃一下下一題 --------------------------------
      const SWIPE = 52;   // 掃夠這個距離就抽牌
      const SLOP  = 8;    // 超過這個距離就當作掃，不再當作點擊
      let drag = null;

      function setDrag(card, dx, dy) {
        card.style.setProperty("--dx", dx.toFixed(1) + "px");
        card.style.setProperty("--dy", dy.toFixed(1) + "px");
        card.style.setProperty("--tilt", (dx / 26).toFixed(2) + "deg");
      }
      const onTop = t => order[0] === t || order[0].contains(t);

      deckEl.addEventListener("pointerdown", e => {
        if (busy || e.button > 0 || !onTop(e.target)) return;
        const card = order[0];
        drag = { x: e.clientX, y: e.clientY, id: e.pointerId, card, moved: false };
        try { card.setPointerCapture(e.pointerId); } catch {}
        card.classList.add("dragging");
      });

      deckEl.addEventListener("pointermove", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        if (Math.abs(dx) > SLOP || Math.abs(dy) > SLOP) drag.moved = true;
        setDrag(drag.card, dx * 0.85, dy * 0.5);
      });

      deckEl.addEventListener("pointerup", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        const card = drag.card;
        deckEl.dataset.swiped = drag.moved ? "1" : "";
        drag = null;
        card.classList.remove("dragging");
        if (Math.hypot(dx, dy) >= SWIPE) {
          next(dx, dy);              // 掃出 = 下一題，沿住掃出方向飛走
        } else {
          setDrag(card, 0, 0);       // 未夠距離就彈返原位
        }
      });

      deckEl.addEventListener("pointercancel", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const card = drag.card;
        drag = null;
        card.classList.remove("dragging");
        setDrag(card, 0, 0);
      });

      deckEl.addEventListener("click", e => {
        if (!onTop(e.target)) return;
        if (deckEl.dataset.swiped) { deckEl.dataset.swiped = ""; return; }  // 掃完唔好再翻卡
        flip();
      });
      deckEl.addEventListener("keydown", e => {
        if (e.target !== order[0]) return;
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
      });
      document.addEventListener("keydown", e => {
        if (e.target !== document.body) return;
        if (e.key === " ") { e.preventDefault(); flip(); }
        else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      });

      document.getElementById("nextBtn").addEventListener("click", () => next());
      document.getElementById("shuffleBtn").addEventListener("click", () => {
        refill();
        deal();
      });

      // 開場直接發第一題，唔使等
      function deal() {
        if (!pool.length) refill();
        const first = pool.pop();
        drawn = 1;
        order[0].innerHTML = faceHTML(first);
        applyRoles();
        preload();
        renderCount();
      }

      refill();
      deal();
    </script>
  </body>
</html>
