<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>疊注賭盤 · 冷知識</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="proto-mono.css" />
    <style>
      :root {
        --card-solid: #FFFFFF;
        --card-edge: #F1ECE0;
        --ink-on-card: #1F1B14;
        --ink-on-card-faint: #A8A091;
        --ink-faint: #A49B8C;
        --serif: var(--sans);
      }
      html, body { height: 100%; }
      body {
        color: var(--ink);
        font-size: 16px;
        letter-spacing: 0.01em;
        overflow-x: hidden;
        min-height: 100vh;
      }

      .stage {
        max-width: 640px;
        margin: 0 auto;
        padding: 3.25rem 1.75rem 7rem;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── 卡組 ──────────────────────────────── */
      .question-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding-bottom: 1.5rem;
      }
      .deck {
        /* 橫向卡：跟視窗闊度縮，高度上限保證唔使捲 */
        --deck-max-h: min(46vh, 22rem);
        position: relative;
        width: min(32rem, 90vw, calc(var(--deck-max-h) * 7 / 5));
        height: auto;
        max-height: var(--deck-max-h);
        aspect-ratio: 7 / 5;
        margin: 0 auto;
        perspective: 1400px;
      }
      .card {
        position: absolute;
        inset: 0;
        background: var(--card-solid);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.45s ease;
      }
      /* 牌堆位置：0 = 面頂，1、2 疊喺下面等上場 */
      .card[data-pos="0"] {
        --dx: 0px;
        --dy: 0px;
        --tilt: 0deg;
        z-index: 3;
        /* 面頂張卡嘅「面」由 flipper 兩塊 face 負責，卡殼透明 */
        background: transparent;
        border-color: transparent;
        transform:
          translate3d(var(--dx), var(--dy), 0)
          rotate(calc(-1.4deg + var(--tilt)));
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .card[data-pos="1"] {
        transform: translate(4px, 5px) rotate(0.8deg) scale(0.985);
        opacity: 0.94;
        z-index: 2;
      }
      .card[data-pos="2"] {
        transform: translate(9px, 10px) rotate(-1.8deg) scale(0.97);
        background: var(--card-edge);
        opacity: 0.8;
        z-index: 1;
      }
      /* 抽走那張：沿掃出方向飛離牌堆，transform 由 JS 設定 */
      .card.gone {
        opacity: 0;
        z-index: 4;
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.26s ease 0.22s;
      }
      .card.dragging { transition: none; cursor: grabbing; }
      .card.no-anim { transition: none; }
      .card[data-pos="0"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      /* 翻卡：正面題目，背面答案。
         用 keyframes 而唔係 transition，等卡喺翻嘅中途
         提起、放大少少，落返底先安定 —— 似真手翻卡。 */
      .flipper {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: rotateY(0);
      }
      .flipper.flipped {
        transform: rotateY(180deg);
        animation: flipToBack 0.62s cubic-bezier(0.32, 0.4, 0.18, 1) both;
      }
      .flipper.flipback {
        transform: rotateY(0);
        animation: flipToFront 0.62s cubic-bezier(0.32, 0.4, 0.18, 1) both;
      }
      @keyframes flipToBack {
        0%   { transform: rotateY(0) translateY(0) scale(1); }
        45%  { transform: rotateY(88deg) translateY(-16px) scale(1.05); }
        100% { transform: rotateY(180deg) translateY(0) scale(1); }
      }
      @keyframes flipToFront {
        0%   { transform: rotateY(180deg) translateY(0) scale(1); }
        45%  { transform: rotateY(92deg) translateY(-16px) scale(1.05); }
        100% { transform: rotateY(0) translateY(0) scale(1); }
      }
      .face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.7rem;
        padding: 1.5rem 2rem;
        text-align: center;
        background: var(--card-solid);
        border: 1px solid var(--line);
        border-radius: 22px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .face.back { transform: rotateY(180deg); }
      /* 答案面：頂部細字重覆題目 */
      .back-q {
        position: absolute;
        top: 1.15rem;
        left: 1.6rem;
        right: 1.6rem;
        font-family: var(--serif);
        font-size: 0.78rem;
        color: var(--ink-on-card-faint);
        line-height: 1.45;
        margin: 0;
      }

      .cat {
        font-size: 0.68rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-on-card-faint);
        margin: 0;
      }
      .question {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(1.1rem, 3.6vw, 1.38rem);
        line-height: 1.6;
        color: var(--ink-on-card);
        margin: 0;
        text-wrap: balance;
      }
      .question.placeholder { color: var(--ink-on-card-faint); }
      .num {
        font-family: var(--serif);
        font-size: clamp(2.1rem, 7vw, 2.9rem);
        font-weight: 600;
        color: var(--accent);
        letter-spacing: -0.02em;
        line-height: 1.15;
        font-variant-numeric: lining-nums tabular-nums;
        margin: 0;
      }
      .num small {
        font-size: 1rem;
        font-weight: 500;
        color: var(--ink-on-card);
        margin-left: 0.25rem;
      }
      .note {
        font-family: var(--serif);
        font-size: 0.8rem;
        color: var(--ink-on-card-faint);
        margin: 0;
        max-width: 30ch;
        line-height: 1.55;
      }

      /* ── 頁腳 ──────────────────────────────── */
      .footer-info {
        position: fixed;
        bottom: 1.25rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-faint);
        pointer-events: none;
      }
      .reset {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
        pointer-events: auto;
        padding: 0;
      }
      .reset:hover { color: var(--ink-soft); }

      /* ── 手機：卡片 + 按鈕一屏內 ────────────── */
      @media (max-width: 540px) {
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { min-height: 100dvh; }

        .stage {
          max-width: none;
          width: 100%;
          height: 100dvh;
          max-height: 100dvh;
          min-height: 0;
          padding:
            max(3rem, calc(env(safe-area-inset-top) + 2.6rem))
            max(1rem, env(safe-area-inset-right))
            calc(2.75rem + env(safe-area-inset-bottom))
            max(1rem, env(safe-area-inset-left));
          display: grid;
          grid-template-rows: minmax(0, 1fr);
          overflow: hidden;
        }

        .question-block {
          flex: none;
          min-height: 0;
          padding-bottom: 0;
          overflow: hidden;
        }

        .deck {
          --deck-max-h: min(50dvh, 18rem, calc(100dvh - 8.5rem));
          width: min(92vw, 26rem, calc(var(--deck-max-h) * 7 / 5));
          height: auto;
          max-height: var(--deck-max-h);
        }

        .face { padding: 1rem 1.2rem; gap: 0.55rem; }
        .back-q { top: 0.85rem; left: 1.1rem; right: 1.1rem; font-size: 0.72rem; }

        .question {
          font-size: clamp(1rem, 4.4vw, 1.22rem);
          line-height: 1.5;
        }
        .num { font-size: clamp(1.8rem, 8vw, 2.3rem); }
        .note { font-size: 0.74rem; max-width: 100%; }

        .footer-info {
          bottom: max(0.5rem, env(safe-area-inset-bottom));
          font-size: 0.62rem;
          letter-spacing: 0.14em;
          gap: 1rem;
        }
      }

      @media (max-width: 540px) and (max-height: 680px) {
        .stage { padding-top: max(2.6rem, calc(env(safe-area-inset-top) + 2.3rem)); gap: 0.3rem; }
        .deck {
          --deck-max-h: min(40dvh, 14rem, calc(100dvh - 9.5rem));
          width: min(88vw, 22rem, calc(var(--deck-max-h) * 7 / 5));
        }
        .face { padding: 0.8rem 1rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .card { transition-duration: 0.01ms; }
        .flipper.flipped, .flipper.flipback { animation-duration: 0.01ms; }
      }
    </style>
  </head>
  <body>
    <a class="dw-mark" href="index.html">deskwalk</a>

    <main class="stage">
      <div class="question-block">
        <div class="deck" id="deck">
          <div class="card" data-pos="0" role="button" tabindex="0" aria-label="翻卡睇答案"></div>
          <div class="card" data-pos="1" aria-hidden="true"></div>
          <div class="card" data-pos="2" aria-hidden="true"></div>
        </div>
      </div>
    </main>

    <footer class="footer-info">
      <span id="deckCount"></span>
      <button class="reset" id="shuffleBtn" type="button">重新洗牌</button>
    </footer>

        { c: "歷史", q: "「百年戰爭」實際打咗幾多年？", a: "116", u: "年", note: "陷阱題：唔係 100 年。" },
        { c: "歷史", q: "鐵達尼號沉沒嗰晚有幾多人生還？", a: "≈710", u: "人", note: "船上有 2,200 幾人。" },
        { c: "歷史", q: "拿破崙實際有幾多 cm 高？", a: "≈168", u: "cm", note: "陷阱題：其實係當年法國平均身高。" },
        { c: "歷史", q: "牛津大學教書教咗約幾多年？", a: "≈930", u: "年", note: "老過阿茲特克帝國成幾百年。" },
        { c: "歷史", q: "羅馬鬥獸場可以坐幾多人？", a: "≈50,000", u: "人", note: "同香港大球場差唔多。" },
        { c: "歷史", q: "《蒙羅麗莎》幅畫高幾多 cm？", a: "77", u: "cm", note: "陷阱題：親眼見過都話「咁細張？」" },
        { c: "歷史", q: "倫敦大笨鐘個鐘重約幾多噸？", a: "≈13.7", u: "噸", note: "大笨鐘其實係個鐘嘅名，唔係座塔。" },

        // 科技
        { c: "科技", q: "世界第一部電子電腦 ENIAC 重約幾多噸？", a: "≈27", u: "噸", note: "你部手機運算力係佢幾千萬倍。" },
        { c: "科技", q: "1956 年 IBM 第一隻硬碟容量得幾多 MB？", a: "5", u: "MB", note: "有成個雪櫃咁大，要用飛機運。" },
        { c: "科技", q: "全球一日 Google 搜尋約幾多億次？", a: "≈85", u: "億次", note: "平均每人每日一次。" },
        { c: "科技", q: "YouTube 每分鐘俾人上載幾多個鐘嘅片？", a: "≈500", u: "個鐘", note: "你一世都睇唔完一日嘅上載量。" },
        { c: "科技", q: "1983 年第一部商用手提電話賣幾多美元？", a: "≈4,000", u: "美元", note: "Motorola「大水壺」，講半個鐘就冇電。" },
        { c: "科技", q: "全球而家有幾多億部智能手機喺度用緊？", a: "≈70", u: "億部", note: "差唔多人手一部。" },
        { c: "科技", q: "全球 email 有幾多 % 係垃圾郵件？", a: "≈45", u: "%", note: "接近一半。" },
        { c: "科技", q: "世界第一個網站係幾多年前上線？", a: "≈35", u: "年前", note: "1991 年，CERN，而家仲上到。" },
        { c: "科技", q: "全球海底電纜總長約幾多萬 km？", a: "≈140", u: "萬 km", note: "可以圍地球 35 個圈。" },
        { c: "科技", q: "全球跨洲互聯網流量有幾多 % 係行海底電纜？", a: "≈99", u: "%", note: "陷阱題：唔係衛星。" },
        { c: "科技", q: "阿波羅登月電腦嘅記憶體（RAM）得幾多 KB？", a: "≈4", u: "KB", note: "你部手機係佢一百萬倍以上。" },
        { c: "科技", q: "Bitcoin 總發行上限係幾多萬粒？", a: "2,100", u: "萬粒", note: "寫死喺程式碼度，一粒都唔會多。" },
        { c: "科技", q: "而家有幾多個運作中嘅人造衛星喺地球軌道？", a: "≈12,000", u: "個", note: "Starlink 一間公司佔咗一半以上。" },

        // 雜項
        { c: "雜項", q: "埃菲爾鐵塔連天線高約幾多米？", a: "≈330", u: "米", note: "天氣熱膨脹時仲會高多 15 cm。" },
        { c: "雜項", q: "自由神像連底座高約幾多米？", a: "≈93", u: "米", note: "神像本身得約 46 米。" },
        { c: "雜項", q: "鋼琴有幾多個琴鍵？", a: "88", u: "個", note: "陷阱題：52 白 + 36 黑。" },
        { c: "雜項", q: "麥當勞全球大約有幾多間分店？", a: "≈40,000", u: "間", note: "遍佈超過 100 個國家。" },
        { c: "雜項", q: "一年大約有幾多秒？", a: "≈3,153", u: "萬秒", note: "31,536,000 秒（平年）。" },
        { c: "雜項", q: "一副 52 張啤牌嘅排列組合寫出嚟有幾多個位數字？", a: "68", u: "個位", note: "每次洗勻嘅牌序好可能係宇宙史上第一次出現。" },
        { c: "雜項", q: "全世界一日飲咗幾多億杯可口可樂公司飲品？", a: "≈19", u: "億杯", note: "每四個地球人就有一杯。" },
        { c: "雜項", q: "一支鉛筆可以連續畫幾多 km 嘅線？", a: "≈56", u: "km", note: "或者寫 45,000 個英文字。" },
        { c: "雜項", q: "世界上而家有幾多種語言？", a: "≈7,000", u: "種", note: "平均每兩星期就有一種消失。" },
        { c: "雜項", q: "全球平均每人擁有幾多粒 LEGO？", a: "≈86", u: "粒", note: "LEGO 係全球最大嘅「車呔製造商」——每年幾億條迷你呔。" },
        { c: "雜項", q: "《牛津英語詞典》收錄約幾多萬個詞？", a: "≈60", u: "萬個", note: "普通人日常用得約 2 萬個。" },
        { c: "雜項", q: "史上最貴車牌（杜拜「P7」）賣咗約幾多億港紙？", a: "≈1.2", u: "億港紙", note: "2023 年拍賣，夠買成層山頂豪宅。" },
        { c: "雜項", q: "一架波音 747 有幾多萬個零件？", a: "≈600", u: "萬個", note: "由幾千間供應商夾埋。" },
        { c: "雜項", q: "全球平均一日出生幾多萬個 BB？", a: "≈37", u: "萬個", note: "即係每秒 4 個。" },
        { c: "雜項", q: "全世界大約有幾多億隻狗？", a: "≈9", u: "億隻", note: "大部分其實係流浪狗。" },
        { c: "雜項", q: "一張紙對摺最多次嘅紀錄係幾多次？", a: "12", u: "次", note: "陷阱題：理論話 7 次，有位學生用長紙摺到 12。" },
        { c: "雜項", q: "史上最大顆鑽石原石（Cullinan）有幾多卡？", a: "3,106", u: "卡", note: "切開後有幾粒鑲咗喺英國王冠。" },
        { c: "雜項", q: "羅浮宮一年有幾多萬人參觀？", a: "≈900", u: "萬人", note: "八成人係為咗睇蒙羅麗莎。" },
        { c: "雜項", q: "奧運「金」牌其實含幾多克金？", a: "6", u: "克", note: "陷阱題：其餘 500 幾克係銀。" },
        { c: "雜項", q: "而家全球人口約幾多億？", a: "≈82", u: "億", note: "2026 年估算。" },
      ];

      // --- Deck ---------------------------------------------------------
      const deckEl  = document.getElementById("deck");
      const countEl = document.getElementById("deckCount");

      let pool = [];       // 未抽的題目，抽完自動重洗
      let drawn = 0;       // 這副牌已抽的題數
      let order = [...deckEl.querySelectorAll(".card")];  // order[0] = 面頂那張
      let onDeck = null;   // 已經寫喺 order[1] 度、下一張會上場的題目
      let busy = false;

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function refill() {
        pool = shuffle(BANK.slice());
        drawn = 0;
      }
      function renderCount() {
        countEl.textContent = `${drawn} / ${BANK.length}`;
      }

      // 正面題目，背面答案；tap 翻轉
      function faceHTML(pick) {
        return `<div class="flipper">
              <div class="face front">
                <p class="cat">${pick.c}</p>
                <p class="question">${pick.q}</p>
              </div>
              <div class="face back" aria-hidden="true">
                <p class="back-q">${pick.q}</p>
                <p class="num">${pick.a}${pick.u ? ` <small>${pick.u}</small>` : ""}</p>
                ${pick.note ? `<p class="note">${pick.note}</p>` : ""}
              </div>
            </div>`;
      }

      function applyRoles() {
        order.forEach((c, i) => {
          c.dataset.pos = i;
          if (i === 0) {
            c.setAttribute("role", "button");
            c.setAttribute("tabindex", "0");
            c.setAttribute("aria-label", "翻卡睇答案");
            c.removeAttribute("aria-hidden");
          } else {
            c.removeAttribute("role");
            c.removeAttribute("tabindex");
            c.removeAttribute("aria-label");
            c.setAttribute("aria-hidden", "true");
          }
        });
      }

      // 下一題預先寫喺牌堆第二張度（答案喺背面），掃開面頂張即刻見到。
      function preload() {
        if (!pool.length) refill();
        onDeck = pool.pop();
        order[1].innerHTML = faceHTML(onDeck);
      }

      let flipLock = false;   // 翻到一半唔好再翻，動畫會跳格
      function flip() {
        if (busy || flipLock) return;
        const flipper = order[0].querySelector(".flipper");
        if (!flipper) return;
        const toBack = !flipper.classList.contains("flipped");
        flipper.classList.toggle("flipped", toBack);
        flipper.classList.toggle("flipback", !toBack);
        const back = flipper.querySelector(".face.back");
        if (back) back.setAttribute("aria-hidden", String(!toBack));
        order[0].setAttribute("aria-label", toBack ? "返回題目" : "翻卡睇答案");
        flipLock = true;
        setTimeout(() => { flipLock = false; }, 480);
      }

      // 抽下一題：面頂那張飛走，下面牌堆嗰張（已經寫好題目）升上嚟。
      // ux / uy = 飛走方向（掃出嘅向量），預設向上。
      function next(ux = 0, uy = -1) {
        if (busy) return;
        if (!onDeck) preload();
        drawn++;
        busy = true;

        const outgoing = order[0];

        const len = Math.hypot(ux, uy) || 1;
        const dist = Math.max(deckEl.offsetWidth, deckEl.offsetHeight) * 1.5;
        outgoing.classList.remove("dragging");
        outgoing.classList.add("gone");
        outgoing.style.transform =
          `translate3d(${(ux / len * dist).toFixed(0)}px, ${(uy / len * dist).toFixed(0)}px, 0)` +
          ` rotate(${(ux / len * 16 - 4).toFixed(1)}deg) scale(1.02)`;

        order = [order[1], order[2], order[0]];
        applyRoles();
        renderCount();

        // 面頂換咗之後，即刻再排定下一題喺第二張牌
        onDeck = null;
        preload();

        const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 480;
        setTimeout(() => {
          // 飛走那張洗返落牌堆底
          outgoing.classList.add("no-anim");
          outgoing.classList.remove("gone");
          outgoing.style.transform = "";
          ["--dx", "--dy", "--tilt"].forEach(v => outgoing.style.removeProperty(v));
          outgoing.innerHTML = "";
          void outgoing.offsetWidth;
          outgoing.classList.remove("no-anim");
          busy = false;
        }, wait);
      }

      // --- 點一下翻卡 / 掃一下下一題 --------------------------------
      const SWIPE = 52;   // 掃夠這個距離就抽牌
      const SLOP  = 8;    // 超過這個距離就當作掃，不再當作點擊
      let drag = null;

      function setDrag(card, dx, dy) {
        card.style.setProperty("--dx", dx.toFixed(1) + "px");
        card.style.setProperty("--dy", dy.toFixed(1) + "px");
        card.style.setProperty("--tilt", (dx / 26).toFixed(2) + "deg");
      }
      const onTop = t => order[0] === t || order[0].contains(t);

      deckEl.addEventListener("pointerdown", e => {
        if (busy || e.button > 0 || !onTop(e.target)) return;
        const card = order[0];
        drag = { x: e.clientX, y: e.clientY, id: e.pointerId, card, moved: false };
        try { card.setPointerCapture(e.pointerId); } catch {}
        card.classList.add("dragging");
      });

      deckEl.addEventListener("pointermove", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        if (Math.abs(dx) > SLOP || Math.abs(dy) > SLOP) drag.moved = true;
        setDrag(drag.card, dx * 0.85, dy * 0.5);
      });

      deckEl.addEventListener("pointerup", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        const card = drag.card;
        deckEl.dataset.swiped = drag.moved ? "1" : "";
        drag = null;
        card.classList.remove("dragging");
        if (Math.hypot(dx, dy) >= SWIPE) {
          next(dx, dy);              // 掃出 = 下一題，沿住掃出方向飛走
        } else {
          setDrag(card, 0, 0);       // 未夠距離就彈返原位
        }
      });

      deckEl.addEventListener("pointercancel", e => {
        if (!drag || e.pointerId !== drag.id) return;
        const card = drag.card;
        drag = null;
        card.classList.remove("dragging");
        setDrag(card, 0, 0);
      });

      deckEl.addEventListener("click", e => {
        if (!onTop(e.target)) return;
        if (deckEl.dataset.swiped) { deckEl.dataset.swiped = ""; return; }  // 掃完唔好再翻卡
        flip();
      });
      deckEl.addEventListener("keydown", e => {
        if (e.target !== order[0]) return;
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
      });
      document.addEventListener("keydown", e => {
        if (e.target !== document.body) return;
        if (e.key === " ") { e.preventDefault(); flip(); }
        else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      });

      document.getElementById("shuffleBtn").addEventListener("click", () => {
        refill();
        deal();
      });

      // 開場直接發第一題，唔使等
      function deal() {
        if (!pool.length) refill();
        const first = pool.pop();
        drawn = 1;
        order[0].innerHTML = faceHTML(first);
        applyRoles();
        preload();
        renderCount();
      }

      refill();
      deal();
    </script>
  </body>
</html>
