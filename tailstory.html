<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Black Stories — deskwalk</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { background-image: none; }

      main {
        max-width: 620px;
        margin: 0 auto;
        padding: 3rem 1.25rem 6rem;
      }

      /* ---------- header ---------- */
      .back {
        display: inline-block;
        font-size: 0.85rem;
        color: var(--ink-soft);
        text-decoration: none;
        margin-bottom: 2rem;
      }
      .back:hover { color: var(--accent); }

      header h1 {
        margin: 0 0 0.4rem;
        font-size: 2.4rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      header .count {
        margin: 0 0 2.25rem;
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      /* ---------- list row ---------- */
      .card {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        cursor: pointer;
        background: var(--card);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow:
          0 6px 16px -12px rgba(26, 23, 18, 0.20),
          inset 0 1px 0 var(--glass-rim);
        padding: 1.1rem 1.3rem;
        margin-bottom: 0.7rem;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      }
      .card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.02rem;
        font-weight: 600;
        color: var(--ink);
      }

      /* difficulty meter */
      .lv {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
        font-size: 0.73rem;
        color: var(--ink-soft);
      }
      .meter { display: inline-flex; gap: 2px; flex: 0 0 auto; }
      .meter i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--line);
      }
      .meter i.on { background: color-mix(in srgb, var(--accent) 70%, var(--line)); }

      /* ---------- loading skeleton ---------- */
      .card[aria-hidden="true"] { pointer-events: none; cursor: default; }
      .skel-line {
        height: 0.95rem;
        border-radius: 0.5rem;
        background: linear-gradient(
          90deg,
          var(--line) 25%,
          color-mix(in srgb, var(--line) 40%, transparent) 50%,
          var(--line) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s ease infinite;
      }
      .skel-line.title { width: 42%; margin-bottom: 0.75rem; }
      .skel-line.sub   { width: 62%; height: 0.7rem; }
      @keyframes shimmer {
        from { background-position: 200% 0; }
        to   { background-position: -200% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .skel-line { animation: none; }
      }

      /* ---------- detail (dark) ---------- */
      .detail {
        --d-bg:   #14120E;
        --d-ink:  #F7F5F0;
        --d-soft: rgba(247, 245, 240, 0.50);
        --d-line: rgba(247, 245, 240, 0.22);

        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        flex-direction: column;
        background: var(--d-bg);
        color: var(--d-ink);
        padding:
          calc(env(safe-area-inset-top) + 1.1rem)
          1.6rem
          calc(env(safe-area-inset-bottom) + 1.5rem);
      }
      .detail[open] { display: flex; animation: fade 0.22s ease; }
      @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

      .d-close {
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        background: rgba(247, 245, 240, 0.12);
        color: var(--d-ink);
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
      }
      .d-close:hover { background: rgba(247, 245, 240, 0.2); }

      .d-mark {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        color: var(--d-ink);
      }

      .d-body { flex: 0 0 auto; }
      .d-lab {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        color: var(--accent);
        margin-bottom: 0.8rem;
      }
      .d-text {
        margin: 0;
        font-size: 1.45rem;
        line-height: 1.55;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .d-text + .d-text { margin-top: 0.8rem; }
      .d-meta {
        margin: 1.1rem 0 0;
        font-size: 0.78rem;
        color: var(--d-soft);
      }
      .d-note {
        margin: 1.1rem 0 0;
        font-size: 0.82rem;
        line-height: 1.7;
        color: var(--d-soft);
      }
      .d-note::before { content: "◆ "; color: var(--accent); opacity: 0.7; }

      .d-dots {
        flex: 0 0 auto;
        display: flex;
        gap: 0.45rem;
        justify-content: center;
        margin: 2.2rem 0;
      }
      .d-dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(247, 245, 240, 0.28);
        transition: background 0.2s ease;
      }
      .d-dots i.on { background: var(--d-ink); }

      .d-actions {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .d-btn {
        width: 100%;
        border-radius: var(--pill);
        font: inherit;
        font-size: 0.95rem;
        padding: 1.05rem;
        cursor: pointer;
        transition: opacity 0.18s ease, background 0.18s ease;
      }
      .d-btn.primary {
        border: 0;
        background: var(--d-ink);
        color: var(--d-bg);
        font-weight: 600;
      }
      .d-btn.primary:hover { opacity: 0.88; }
      .d-btn.ghost {
        border: 1px solid var(--d-line);
        background: transparent;
        color: var(--d-ink);
      }
      .d-btn.ghost:hover { background: rgba(247, 245, 240, 0.08); }

      body.locked { overflow: hidden; }

      @media (min-width: 640px) {
        .detail { padding-left: max(1.6rem, calc(50vw - 300px)); padding-right: max(1.6rem, calc(50vw - 300px)); }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="index.html">← deskwalk</a>

      <header>
        <h1>Black Stories</h1>
        <p class="count" id="count"></p>
      </header>

      <div id="list"></div>
    </main>

    <section class="detail" id="detail" role="dialog" aria-modal="true" aria-label="題目">
      <button class="d-close" id="dClose" type="button" aria-label="關閉">✕</button>

      <div class="d-mark">
        <svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
          <path d="M12 0c.6 7.2 4.2 10.8 12 12-7.8 1.2-11.4 4.8-12 12-.6-7.2-4.2-10.8-12-12C7.8 10.8 11.4 7.2 12 0Z" fill="currentColor"/>
        </svg>
      </div>

      <div class="d-body">
        <span class="d-lab" id="dLab"></span>
        <div id="dText"></div>
        <p class="d-meta" id="dMeta"></p>
        <p class="d-note" id="dNote" hidden></p>
      </div>

      <div class="d-dots" id="dDots"></div>

      <div class="d-actions">
        <button class="d-btn primary" id="dPrimary" type="button"></button>
        <button class="d-btn ghost" id="dGhost" type="button">關閉</button>
      </div>
    </section>

    <script>
      /* ── 題庫喺 Google 試算表 ───────────────────────────────────
         試算表：Black Stories — 題庫
         https://docs.google.com/spreadsheets/d/1WwguyEA3D8hoXvg0gc1KRe58bDq7n7I6JVjYGDdt9UA/edit

         加新題目 = 喺張表加一行，唔使改呢個檔案。

         安裝：把 apps-script-blackstories.gs 貼入張表嘅 Apps Script，
         部署成網頁應用程式（具存取權：任何人），再把佢畀你嗰條
         /exec 網址貼落下面個 API。

         API 留空 = 用下面 FALLBACK 嗰批（即係下面呢份寫死嘅備份）。   */
      const API = 'https://script.google.com/macros/s/AKfycbxU0elJS8tpAEUTRvg2eAb3pd6awL-zY-mRyPWNHlwCyFuSgx6-foDsCtdpRL3_7fI6/exec';

      const STORE = 'blackstories-cache';

      /* 連唔到網／未貼 API 時用。內容同試算表初始狀態一致。 */
      const FALLBACK = [
        {"id": "A1", "title": "人聲", "level": 1, "minutes": 3, "soup": "隔壁房間傳來許多人的聲音，時而喧鬧，時而歡笑。推門一看，裡面只有一個人。", "base": "那個人在看電視。"},
        {"id": "G6", "title": "綁在椅子上", "level": 2, "minutes": 5, "soup": "最疼他的人把他綁在椅子上，他卻一點也不介意。", "base": "他是個嬰兒，母親把他綁在餐椅上餵飯。", "note": "原題（Binded）沒有公開答案，此湯底為自行撰寫。"},
        {"id": "A5", "title": "只有公主逃了出去", "level": 3, "minutes": 6, "soup": "王子帶著公主逃出鬼堡。魔鬼攔住他們說：「白色代表天使，穿白色連衣裙的公主不能通過，必須死。」最後王子死了，公主逃了出去。", "base": "公主殺了王子，用他的血把白裙染成紅色。"},
        {"id": "D2", "title": "逛花園", "level": 3, "minutes": 6, "soup": "那天我在一座很大很大的花園裡走著，突然停在某處，然後就死了，流了很多很多血。", "base": "我是一隻蚊子，在花園裡尋找目標。正在吸血時被一巴掌拍死，肚子裡的血全部濺了出來。"},
        {"id": "B14", "title": "簽名", "level": 4, "minutes": 8, "soup": "一位大明星在簽名會上簽完名後，突然死亡。", "base": "粉絲為了讓簽名升值——因為那會是「最後一張簽名」——所以殺了他。"},
        {"id": "C13", "title": "對面大樓", "level": 4, "minutes": 9, "soup": "他看見對面大樓有人被殺。兇手望向他，用手指由下往上點。他當場被嚇死。", "base": "兇手在數樓層，確認他住在幾樓，準備上門滅口。"},
        {"id": "C26", "title": "夜半敲門", "level": 4, "minutes": 9, "soup": "一個人住在山頂小屋。半夜聽見敲門聲，開門卻沒有人，便回去睡了。門又響，還是沒有人，如此反覆數次。第二天，山腳下發現一具屍體，警方帶走了山頂那個人。", "base": "有人身負重傷，爬到門口求救。屋主每次開門都把他撞下山坡，反覆數次，最後傷者氣絕。"},
        {"id": "G10", "title": "十樓", "level": 4, "minutes": 9, "soup": "一個男人住在十樓。每天早上出門，他搭電梯下到地面；晚上回家，他按七樓。", "base": "他個子很矮，按不到十樓的按鈕，最高只能碰到七樓，其餘路程走樓梯。", "note": "原題結尾寫明「然後走三層樓梯上去」，提示過強，已移入湯底。"},
        {"id": "G8", "title": "車裡的陌生人", "level": 5, "minutes": 9, "soup": "一對夫婦開車途中沒油了。丈夫下車去找油。回來時，妻子已經死了，車裡卻多了一個陌生人。車門反鎖、車窗緊閉、車身完好無損。", "base": "妻子懷有身孕。丈夫離開期間她臨盆，難產而死。那個「陌生人」是剛出生的嬰兒。"},
        {"id": "B9", "title": "郵票", "level": 5, "minutes": 10, "soup": "一個男人發現自己少貼了一張郵票，不久之後就死了。", "base": "他寄了一個定時炸彈給仇人。郵資不足被退回，炸彈按原定時間在他家中引爆。"},
        {"id": "C2", "title": "牛吃草", "level": 5, "minutes": 11, "soup": "你獨自住在郊外，鄰居是一對養牛的夫婦。某天深夜你被爭吵聲驚醒，接著聽到摔東西的聲音、砍劈的聲音，以及牛吃草的聲音；過了一會兒，還聽到撞門聲。你沒有理會。第二天，鄰居的女主人慘死在你家門口。", "base": "丈夫砍斷了妻子的四肢。沒有手腳的妻子用嘴咬著地上的草，一路爬到你家門口求救，用頭撞門。你沒有開門，她因失血過多而死。", "note": "香港、台灣流傳度最高的一題。"},
        {"id": "C1", "title": "海龜湯", "level": 5, "minutes": 12, "soup": "一位船長走進餐廳，點了一碗海龜湯。喝下去覺得味道有些奇怪，便問店家是用什麼做的。店家答：「用海龜肉。」船長沉思片刻，痛哭起來，隨後自殺。", "base": "他早年出海遇上海難，在海上漂流許久，糧食耗盡。船員為了讓船長活下去，割下已死船員的肉煮成湯，騙他說是海龜湯。多年後嚐到真正的海龜湯，他才知道當年的真相。", "note": "「海龜湯」這個名稱的由來，本體題。"},
        {"id": "C19", "title": "生日", "level": 6, "minutes": 12, "soup": "今天是我生日，我請了所有好朋友來。吹完蠟燭，四周響起掌聲。之後，我把所有好朋友都殺了。", "base": "我是盲人。從前在野外受困，朋友說大家一起砍下一隻手作為糧食救我。生日那晚聽見掌聲——鼓掌需要兩隻手，原來當年砍手的只有我一個。"},
        {"id": "B13", "title": "半根火柴", "level": 6, "minutes": 13, "soup": "一個人在沙漠中面朝下死去，身邊散落著行李，手裡緊握半根火柴。", "base": "他們搭乘熱氣球途中故障，必須減輕重量，於是抽籤決定誰跳下去。他抽中了那半根，連同行李一起被扔了下去。"},
        {"id": "C4", "title": "三兄弟", "level": 6, "minutes": 13, "soup": "從前有三兄弟，大哥和二哥是雙胞胎，三人感情極好，常常睡在一起。大哥病死之後，三弟殺了二哥。為什麼？", "base": "三弟患有精神疾病，無法接受大哥的死。他把二哥剖成左右兩半，一半放在左邊，一半放在右邊；這樣躺下去，就像大哥還在。"},
        {"id": "E3", "title": "電話響了", "level": 7, "minutes": 14, "soup": "絕望的女子決定跳樓。縱身而下的那一刻，電話響了。她後悔了，但已經來不及。", "base": "周圍的人全都變成了喪屍，她以為自己是最後一個人類，才決定尋死。電話響起，代表還有人活著。"},
        {"id": "C7", "title": "葬禮姊妹", "level": 7, "minutes": 15, "soup": "母親過世，姊妹兩人參加葬禮。一個月後，姊姊也死了。", "base": "妹妹在葬禮上見到一名男子，一見鍾情，但葬禮結束後對方消失無蹤，怎麼也找不到。妹妹想再辦一次葬禮，希望能再見到那個人，於是殺了姊姊。", "note": "原版湯面點明了男子與一見鍾情，等於直接給出答案。現已收窄到只交代兩次死亡。"},
        {"id": "F21", "title": "新鞋", "level": 7, "minutes": 15, "soup": "一個女人早上買了一雙新鞋。晚上上班，開工不久就死了。", "base": "高跟鞋讓她比平時高了一些。她在馬戲團擔任飛刀表演的活靶，飛刀手按照平時的高度出手，正中了她。"},
        {"id": "N1", "title": "樹上的男子", "level": 8, "minutes": 18, "soup": "一名男子死在森林裡的一棵樹上。", "base": "他當時正在附近的海裡潛水。不遠處發生大規模森林火災，消防飛機到海面汲水滅火，把潛水中的他一併吸進水箱，隨後連水一起空投到火場上空。他從高空墜落，摔死在樹上。"},
      ];

      /* ---------- load ---------- */
      async function load() {
        if (API) {
          try {
            const d = await (await fetch(API)).json();
            if (d && d.ok && Array.isArray(d.puzzles) && d.puzzles.length) {
              try { localStorage.setItem(STORE, JSON.stringify(d.puzzles)); } catch (e) {}
              return d.puzzles;
            }
          } catch (e) {}
          try {
            const raw = localStorage.getItem(STORE);
            if (raw) return JSON.parse(raw);
          } catch (e) {}
        }
        return FALLBACK;
      }

      /* ---------- helpers ---------- */
      const esc  = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]));
      const para = (s, cls) => esc(s).split('\n').map(l => `<p class="${cls}">${l}</p>`).join('');
      const lv   = n => Math.min(10, Math.max(1, Math.round(Number(n) || 5)));
      const mins = n => Number(n) || 10;

      let PUZZLES = [];
      let at = -1;        // 開緊邊題
      let page = 0;       // 0 = 湯面, 1 = 湯底

      /* ---------- loading placeholder ---------- */
      function renderSkeleton() {
        document.querySelector('#count').textContent = '載入中…';
        document.querySelector('#list').innerHTML = Array.from({ length: 6 }, () => `
          <div class="card" aria-hidden="true">
            <div class="skel-line title"></div>
            <div class="skel-line sub"></div>
          </div>
        `).join('');
      }

      /* ---------- list ---------- */
      function renderList() {
        document.querySelector('#count').textContent = `${PUZZLES.length} 題`;
        const listEl = document.querySelector('#list');

        listEl.innerHTML = PUZZLES.map((p, i) => `
          <button class="card" type="button" data-i="${i}">
            <h2>${esc(p.title)}</h2>
            <div class="lv">
              <span class="meter">${Array.from({length:10},(_,k)=>`<i${k < lv(p.level) ? ' class="on"' : ''}></i>`).join('')}</span>
              難度 ${lv(p.level)} · 約 ${mins(p.minutes)} 分鐘
            </div>
          </button>
        `).join('');

        listEl.querySelectorAll('.card').forEach(el => {
          el.onclick = () => open(Number(el.dataset.i));
        });
      }

      /* ---------- detail ---------- */
      const detail   = document.querySelector('#detail');
      const dLab     = document.querySelector('#dLab');
      const dText    = document.querySelector('#dText');
      const dMeta    = document.querySelector('#dMeta');
      const dNote    = document.querySelector('#dNote');
      const dDots    = document.querySelector('#dDots');
      const dPrimary = document.querySelector('#dPrimary');

      function open(i) {
        at = i;
        page = 0;
        detail.setAttribute('open', '');
        document.body.classList.add('locked');
        paint();
        document.querySelector('#dClose').focus();
      }

      function close() {
        detail.removeAttribute('open');
        document.body.classList.remove('locked');
        at = -1;
      }

      function paint() {
        const p = PUZZLES[at];
        if (!p) return;
        const last = at === PUZZLES.length - 1;

        dLab.textContent  = page === 0 ? p.title : '湯底';
        dText.innerHTML   = para(page === 0 ? p.soup : p.base, 'd-text');
        dMeta.textContent = page === 0
          ? `難度 ${lv(p.level)} · 約 ${mins(p.minutes)} 分鐘`
          : '';

        if (page === 1 && p.note) {
          dNote.textContent = p.note;
          dNote.hidden = false;
        } else {
          dNote.hidden = true;
        }

        dDots.innerHTML = [0, 1].map(k => `<i${k === page ? ' class="on"' : ''}></i>`).join('');

        dPrimary.textContent = page === 0 ? '揭湯底' : (last ? '完成' : '下一題');

        detail.scrollTop = 0;
      }

      dPrimary.onclick = () => {
        if (page === 0) { page = 1; paint(); return; }
        if (at === PUZZLES.length - 1) { close(); return; }
        at += 1;
        page = 0;
        paint();
      };

      document.querySelector('#dClose').onclick = close;
      document.querySelector('#dGhost').onclick = close;
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && detail.hasAttribute('open')) close();
      });

      /* ---------- go ---------- */
      renderSkeleton();
      load().then(list => {
        PUZZLES = [...list].sort((a, b) => lv(a.level) - lv(b.level) || mins(a.minutes) - mins(b.minutes));
        renderList();
      });
    </script>
