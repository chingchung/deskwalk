<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星圖拾光 · Tile Studies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#292823;font:15px Arial,'Microsoft JhengHei',sans-serif}header,main,footer{max-width:1440px;margin:auto;padding:36px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #d6d0c5}h1{font:42px Georgia,serif;margin:12px 0}p{line-height:1.8;color:#726d64}a{color:inherit}nav{display:flex;gap:14px;align-items:center;margin-top:18px}button{background:none;border:1px solid #b7b0a3;padding:10px 16px;border-radius:24px;cursor:pointer}button[aria-pressed=true]{background:#292823;color:#fff}#directions{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}h2{font-size:20px;font-weight:500}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile svg{display:block;width:100%}.tile small{display:block;font-size:10px;color:#777267;margin:8px 0 12px}.map svg{display:block;width:100%;height:auto}.map{margin-top:22px}article>p{min-height:80px;font-size:13px}article>a{display:block;text-align:center;padding:14px;border:1px solid #c5bdaf;margin-top:20px;text-decoration:none}.eyebrow{font-size:11px;letter-spacing:3px}footer{font-size:12px;border-top:1px solid #d6d0c5}@media(max-width:850px){#directions{grid-template-columns:1fr}header,main,footer{padding:22px}header{display:block}h1{font-size:32px}article>p{min-height:0}.tiles{grid-template-columns:repeat(3,1fr)}}</style>
<header><div><span class="eyebrow">DESKWALK / MATERIAL STUDIES 00—03</span><h1>同一片星空，四種筆觸。</h1><p>四邊接口固定。星點偏心、光芒不對稱，讓每片有自己的表情。</p><nav><button id="grid" aria-pressed="false">顯示拼接邊界</button><button id="rotate">旋轉單片 ↻</button></nav></div><a href="star-atlas.html">進入星圖拾光 ↗</a></header>
<main id="directions"></main><footer>閉合星座的人取得它。畫風只改變筆觸，四組使用相同板塊、牌序與接口。下方為合法拼接的兩環樣本。</footer>
<script src="star-atlas-engine.js"></script><script src="star-atlas-visual-lab.js"></script><script src="star-atlas-art.js"></script><script>
const A=StarAtlasArt,E=StarAtlas;let grid=false,rotation=0;
const descriptions={diagonal:'已選定的方向：邊中點與角落接口，單片 1–2 星，淡色小星與短線背景。',night:'深炭色星空、細白連線，星點大小與亮度錯落。接口圓點縮小，讓完整星座的輪廓成為主角。',noir:'暖白紙面、黑色雕刻般的光芒。一顆偏心大星與直接連到半圓接口的粗線，保留大量留白。',cobalt:'鮮藍底、奶黃星光。直接連線與拉長的星芒，像一組流動的絲網印刷。',chalk:'米色紙、青藍放射星。青藍色直線與疏落顆粒，像觀星筆記裡的速寫。'};
const shapes=['bend','straight','fork','cross','bend','end'];
const tiles=shapes.map((shape,i)=>({id:'study-'+i,shape,color:'white',rotation:0}));
const rows=[[0,0,'fork',2],[1,0,'fork',2],[0,1,'bend',0],[1,1,'fork',0],[2,0,'bend',2],[2,1,'bend',3],[-1,0,'end',1]];
const board=rows.map((r,i)=>({id:'study-map-'+i,x:r[0],y:r[1],shape:r[2],rotation:r[3],color:'white'}));
function render(){document.getElementById('directions').innerHTML=Object.entries(A.THEMES).map(([key,p])=>{A.setTheme(key);return '<article><h2>'+p.name+'</h2><p>'+descriptions[key]+'</p><div class="tiles">'+tiles.map((t,i)=>'<div class="tile">'+A.tileSvg({...t,rotation},{frame:true})+'<small>0'+(i+1)+' / '+['轉角','穿越','分岔','交會','轉角變體','末端'][i]+'</small></div>').join('')+'</div><div class="map">'+A.mapSvg(board,{showGrid:grid,title:p.name})+'</div><a href="star-atlas.html" data-theme="'+key+'">用這個畫風試玩 ↗</a></article>';}).join('');document.querySelectorAll('[data-theme]').forEach(a=>a.onclick=()=>{try{localStorage.setItem('atlas-art-theme',a.dataset.theme);}catch{}});}
document.getElementById('grid').onclick=function(){grid=!grid;this.setAttribute('aria-pressed',grid);this.textContent=grid?'隱藏拼接邊界':'顯示拼接邊界';render();};
document.getElementById('rotate').onclick=()=>{rotation=(rotation+1)%4;render();};render();
</script></html>
