<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>星盤 · deskwalk</title><link rel="stylesheet" href="star-atlas.css">
<script src="star-atlas-engine.js" defer></script><script src="star-atlas-visual-lab.js" defer></script><script src="star-atlas-art.js" defer></script><script src="star-atlas.js" defer></script>
</head><body>
<header><span class="wordmark">星盤<span>deskwalk</span></span><button id="new-game" hidden>新局</button></header>
<main id="setup"><div class="setup-content">
<svg class="cover-star" viewBox="0 0 100 100" aria-hidden="true"><path d="M54 3Q53 43 94 51Q54 51 43 96Q48 55 7 46Q48 49 54 3Z"/></svg>
<h1>星盤</h1><p>接起星線，圈出你的星座。</p>
<form id="setup-form"><label for="count">玩家</label><select id="count"><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人</option><option value="6">6 人</option></select><button class="primary" type="submit">開始</button></form>
<button id="resume" hidden>繼續上局 →</button></div></main>
<main id="game" hidden>
<div class="game-top"><div id="players" aria-label="玩家星座數"></div><span id="supply"></span></div>
<section class="sky" aria-label="星圖棋盤"><div id="board-scroll"><div id="board"></div></div><div class="view-controls"><button id="zoom-out" aria-label="縮小">−</button><button id="fit">全圖</button><button id="zoom-in" aria-label="放大">＋</button></div></section>
<div class="dock"><div class="turn"><strong id="turn-title"></strong><span id="turn-hint"></span></div><div id="hand" aria-label="手牌"></div><div class="actions"><button id="rotate" hidden title="右鍵或 R">↻ 旋轉</button><button id="pass" hidden>棄新牌，跳過</button><button id="undo">↶ 悔棋</button></div></div>

</main><div id="notice" role="status" aria-live="polite"></div>
</body></html>
