<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>deskwalk</title>
    <style>
      :root {
        --bg: #f5f5f0;
        --surface: #ffffff;
        --ink: #1a1a1a;
        --ink-soft: #6b6b6b;
        --line: #e5e3da;
        --accent: #2a4a7f;
      }
      * { box-sizing: border-box; }
      body {
        font-family: "Helvetica Neue", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
        margin: 0;
        line-height: 1.6;
        font-size: 16px;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 4rem 1.5rem 5rem;
      }
      header {
        margin-bottom: 3rem;
      }
      header h1 {
        font-size: 2rem;
        margin: 0 0 0.25rem;
        letter-spacing: 0.02em;
      }
      header p {
        color: var(--ink-soft);
        margin: 0;
        font-size: 0.95rem;
      }
      .proto {
        display: block;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1.5rem 1.75rem;
        margin-bottom: 1rem;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s, transform 0.15s;
      }
      .proto:hover {
        border-color: var(--accent);
      }
      .proto h2 {
        margin: 0 0 0.4rem;
        font-size: 1.2rem;
        color: var(--accent);
      }
      .proto .concept {
        margin: 0 0 0.85rem;
        color: var(--ink);
        font-size: 0.95rem;
      }
      .proto .meta {
        color: var(--ink-soft);
        font-size: 0.8rem;
        letter-spacing: 0.03em;
      }
      footer {
        margin-top: 4rem;
        color: var(--ink-soft);
        font-size: 0.8rem;
        text-align: center;
      }
      footer a { color: var(--ink-soft); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>deskwalk</h1>
        <p>桌遊原型實驗</p>
      </header>

      <a class="proto" href="roastking.html">
        <h2>Roast King · 吐糟王</h2>
        <p class="concept">掃 QR 自動派牌,傾偈途中將 5 句吐槽自然塞入對話。全靜態、無計分的祕密任務式派對遊戲。</p>
        <p class="meta">v0.1 · 2026-06-17</p>
      </a>

      <a class="proto" href="headliner.html">
        <h2>Headliner · 頭條人物</h2>
        <p class="concept">派對指認遊戲。抽題、用手指指人、自拍時 AI 自動打格遮眼。</p>
        <p class="meta">v1.1 · 2026-05-28</p>
      </a>

      <a class="proto" href="collective.html">
        <h2>Collective Unconscious．集體潛意識v1</h2>
        <p class="concept">三階段抽題 demo,測試玩家集體默契,以「共感」累積分數推進。</p>
        <p class="meta">v0.5 · 2026-05-15</p>
      </a>

      <footer>
        <a href="https://github.com/chingchung/deskwalk">github</a>
      </footer>
    </main>
  </body>
</html>
